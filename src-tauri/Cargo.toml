[package]
name = "anyboot"
version = "0.1.0"
description = "Select the next boot system from the system tray by updating rEFInd's PreviousBoot variable"
authors = ["you"]
edition = "2021"

[lib]
name = "anyboot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# 内置 HTTP 服务：纯线程模型，不引 async 运行时（IQ6 定稿）
tiny_http = "0.12"
# 首次运行生成 32 位十六进制 token
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# 睡眠预检：读 HKLM\...\Control\Power\HibernateEnabled（语言无关，见 plan §3.4）
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-service-management = "0.3"
