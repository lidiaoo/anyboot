[package]
name = "anyboot"
version = "0.1.0"
description = "Select the next boot system from the system tray by updating rEFInd's PreviousBoot variable"
authors = ["you"]
edition = "2021"

[lib]
name = "anyboot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macOS 窗口透明必须 macos-private-api：它才把 wry/transparent 带进来。
# 没有它，tauri-runtime-wry 在 macOS 上连 window.transparent() 都不编译，
# set_background_color 也是 no-op —— CSS 写再多 transparent，WebView 原生层
# 照样画白底（Windows/Linux 的透明不门控，不受影响）。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5"
# 原生文件夹选择框（选 ESP 目录去识别）：macOS NSOpenPanel / Windows
# IFolderPicker / Linux GTK，同一个 Rust API，不引前端 JS 插件层
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# 远程接入网关：cloudflared 二进制下载。阻塞 HTTP 客户端（项目不引 async
# 运行时，IQ6 定稿），下载放 std::thread 里跑 + 事件推前端；tls=rustls，
# 三端编译都无需 OpenSSL。
ureq = { version = "2", default-features = false, features = ["tls"] }
# 内置 HTTP 服务：纯线程模型，不引 async 运行时（IQ6 定稿）
tiny_http = "0.12"
# WebSocket 推送通道（/api/ws）：握手要按 RFC 6455 算
# Sec-WebSocket-Accept = base64(SHA1(key + GUID))。协议写死用 SHA-1（不是拿它
# 做安全用途），所以这里引 sha1 而不是复用已有的 sha2。
sha1 = "0.10"
base64 = "0.22"
# 首次运行生成 32 位十六进制 token
getrandom = "0.3"
# server-hub M3 终端：PTY 直跑系统 ssh（认证/known_hosts 全由 ssh 本尊在 PTY 里交互）
portable-pty = "0.8"
# server-hub 密码认证：AES-256-GCM 加密落盘（hub_vault.rs），配合 SSH_ASKPASS 免输
aes-gcm = "0.10"
# 备份信封加密（backup.rs）：PBKDF2-HMAC-SHA256 用 HMAC（sha2 已在依赖树里）
hmac = "0.12"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Linux 的托盘图标自己按 SNI(StatusNotifierItem) 协议导出（见 lib.rs 的 linux_sni 模块）。
# 为什么不能继续用 tray-icon / libappindicator：它们在 X11 上都不发任何「托盘被点了」
# 的事件（tray-icon 的 gtk 后端连 activate 信号都没接），而「点选择框不关菜单」要求
# 菜单由我们自己弹 —— 只有拿到 Activate(x,y) 才谈得上。dbus 本来就在依赖树里
# （Cargo.lock 有 dbus 0.9.12），加它不引入任何新 crate、也不需要联网。
dbus = "0.9"
# dbusmenu 那条「打开菜单」被点击时取光标位置当自绘菜单窗的锚点（Event 不带坐标）。
# x11-dl 同样已在依赖树里（tao/wry 都用它），锁 2.21 不引入新 crate。
x11-dl = "2.21"

[target.'cfg(target_os = "windows")'.dependencies]
# 睡眠预检：读 HKLM\...\Control\Power\HibernateEnabled（语言无关，见 plan §3.4）
winreg = "0.55"
# 用系统默认浏览器打开 URL 走 ShellExecuteW（打开 URL 的标准系统入口）。
# 不用 explorer.exe：它会把带 query 的地址当路径解析，且弹错误框时永不退出，
# 同步等它会把命令挂死。这里只用到 Shell 三个特性面（见 open_url_in_browser）。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # 系统信息卡：GlobalMemoryStatusEx（内存）+ GetTickCount64（运行时长）
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # NVRAM 读写：Get/SetFirmwareEnvironmentVariableW（0.59 里在 WindowsProgramming 模块）
    "Win32_System_WindowsProgramming",
    # 提权重扫：SHELLEXECUTEINFOW 的 hkeyClass 字段挂在 Registry feature 下（0.59 的拆法）
    "Win32_System_Registry",
    # NVRAM dump：AdjustTokenPrivileges 启用 SeSystemEnvironmentPrivilege（提权≠特权已启用）
    "Win32_Security",
    # 特权助手服务（免 UAC 提权，见 service_win.rs）：SCM + 命名管道 + 卷句柄
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    # ReadFile/WriteFile/ConnectNamedPipe 都在这个特性门后面（0.59 的拆法）
    "Win32_System_IO",
    # 管道 DACL 用 SDDL 字符串构造（ConvertStringSecurityDescriptorToSecurityDescriptorW）
    "Win32_Security_Authorization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-service-management = "0.3"

# 只读 APFS 解析（Preboot 卷扫描）：macOS 原生能读 Preboot，不需要；
# Windows/Linux 靠它在内存里解析容器分区（零挂载，见 docs/apfs-预演三端统一选型.md）。
# 锁死版本：上游自称 experimental、API 不承诺稳定，升级必须人工过一遍调用点。
# 只用 sync 同步接口 + VolumeSelector 按卷名选卷（apfs crate 只能挂第一个卷，不够用）。
[target.'cfg(not(target_os = "macos"))'.dependencies]
hadris-apfs = { version = "=3.0.0-rc.2", default-features = false, features = ["std", "sync"] }
# apfs_reader 直接用它们的块设备抽象与 Volume 门面（版本与 hadris-apfs 锁死一致）
hadris-fs = { version = "=3.0.0-rc.2", default-features = false, features = ["std", "sync"] }
hadris-storage = { version = "=3.0.0-rc.2", default-features = false, features = ["std", "sync"] }
