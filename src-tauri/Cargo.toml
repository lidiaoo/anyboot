[package]
name = "anyboot"
version = "0.1.0"
description = "Select the next boot system from the system tray by updating rEFInd's PreviousBoot variable"
authors = ["you"]
edition = "2021"

[lib]
name = "anyboot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macOS 窗口透明必须 macos-private-api：它才把 wry/transparent 带进来。
# 没有它，tauri-runtime-wry 在 macOS 上连 window.transparent() 都不编译，
# set_background_color 也是 no-op —— CSS 写再多 transparent，WebView 原生层
# 照样画白底（Windows/Linux 的透明不门控，不受影响）。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5"
# 原生文件夹选择框（选 ESP 目录去识别）：macOS NSOpenPanel / Windows
# IFolderPicker / Linux GTK，同一个 Rust API，不引前端 JS 插件层
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# 内置 HTTP 服务：纯线程模型，不引 async 运行时（IQ6 定稿）
tiny_http = "0.12"
# WebSocket 推送通道（/api/ws）：握手要按 RFC 6455 算
# Sec-WebSocket-Accept = base64(SHA1(key + GUID))。协议写死用 SHA-1（不是拿它
# 做安全用途），所以这里引 sha1 而不是复用已有的 sha2。
sha1 = "0.10"
base64 = "0.22"
# 首次运行生成 32 位十六进制 token
getrandom = "0.3"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Linux 的托盘图标自己按 SNI(StatusNotifierItem) 协议导出（见 lib.rs 的 linux_sni 模块）。
# 为什么不能继续用 tray-icon / libappindicator：它们在 X11 上都不发任何「托盘被点了」
# 的事件（tray-icon 的 gtk 后端连 activate 信号都没接），而「点选择框不关菜单」要求
# 菜单由我们自己弹 —— 只有拿到 Activate(x,y) 才谈得上。dbus 本来就在依赖树里
# （Cargo.lock 有 dbus 0.9.12），加它不引入任何新 crate、也不需要联网。
dbus = "0.9"
# dbusmenu 那条「打开菜单」被点击时取光标位置当自绘菜单窗的锚点（Event 不带坐标）。
# x11-dl 同样已在依赖树里（tao/wry 都用它），锁 2.21 不引入新 crate。
x11-dl = "2.21"

[target.'cfg(target_os = "windows")'.dependencies]
# 睡眠预检：读 HKLM\...\Control\Power\HibernateEnabled（语言无关，见 plan §3.4）
winreg = "0.55"
# 用系统默认浏览器打开 URL 走 ShellExecuteW（打开 URL 的标准系统入口）。
# 不用 explorer.exe：它会把带 query 的地址当路径解析，且弹错误框时永不退出，
# 同步等它会把命令挂死。这里只用到 Shell 三个特性面（见 open_url_in_browser）。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-service-management = "0.3"
