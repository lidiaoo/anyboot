<svg viewBox="0 0 720 496" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC',sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2e35">anyboot 连接 · 新增 / 编辑（主界面）</text>
  <text x="360" y="42" text-anchor="middle" font-size="9" fill="#8a8e99">一台电脑一条记录 · 多网卡候选地址 · 可经跳板机隧道</text>

  <!-- ═══ ① 基本信息 / 令牌 ═══ -->
  <g>
    <rect x="16" y="56" width="216" height="396" rx="28" fill="#ffffff" stroke="#d9dce3" stroke-width="1.5"/>
    <rect x="24" y="64" width="200" height="380" rx="22" fill="#f3f4f8"/>
    <path d="M24 100 h200" stroke="#e4e6ec"/>
    <text x="44" y="88" font-size="12" fill="#6a6e78">‹</text>
    <text x="124" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262e">编辑电脑</text>

    <text x="36" y="118" font-size="8.5" fill="#8a8e99">分组（区分不同电脑）</text>
    <rect x="36" y="126" width="176" height="26" rx="8" fill="#ffffff" stroke="#e1e3ea"/>
    <text x="46" y="143" font-size="9.5" fill="#23262e">家里</text>
    <text x="202" y="143" text-anchor="end" font-size="9" fill="#8a8e99">▾</text>

    <text x="36" y="168" font-size="8.5" fill="#8a8e99">服务端名（空 = 用地址兜底）</text>
    <rect x="36" y="176" width="176" height="26" rx="8" fill="#ffffff" stroke="#e1e3ea"/>
    <text x="46" y="193" font-size="9.5" fill="#23262e">书房台式机</text>

    <text x="36" y="218" font-size="8.5" fill="#8a8e99">访问令牌</text>
    <rect x="36" y="226" width="176" height="26" rx="8" fill="#ffffff" stroke="#e1e3ea"/>
    <text x="46" y="243" font-size="9.5" fill="#23262e">••••••••••••</text>
    <text x="202" y="243" text-anchor="end" font-size="9" fill="#8a8e99">👁</text>

    <rect x="36" y="262" width="176" height="30" rx="9" fill="#e7f5ec"/>
    <circle cx="48" cy="277" r="3.5" fill="#22a35a"/>
    <text x="58" y="281" font-size="9" fill="#1d7a44">在线 · 延迟 18ms（候选最低）</text>

    <text x="36" y="312" font-size="8.5" fill="#8a8e99">电脑端 /health 的 machineId 负责把</text>
    <text x="36" y="324" font-size="8.5" fill="#8a8e99">多个地址归并成同一台电脑。</text>

    <rect x="36" y="340" width="176" height="28" rx="9" fill="#22a35a"/>
    <text x="124" y="358" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">保存</text>
    <text x="124" y="392" text-anchor="middle" font-size="9.5" fill="#c05050">删除此电脑</text>

    <text x="124" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3a3d45">① 基本信息 / 令牌 / 状态</text>
  </g>

  <!-- ═══ ② 候选地址 / 探测模式 ═══ -->
  <g>
    <rect x="252" y="56" width="216" height="396" rx="28" fill="#ffffff" stroke="#d9dce3" stroke-width="1.5"/>
    <rect x="260" y="64" width="200" height="380" rx="22" fill="#f3f4f8"/>
    <path d="M260 100 h200" stroke="#e4e6ec"/>
    <text x="360" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262e">编辑电脑</text>

    <text x="272" y="118" font-size="8.5" fill="#8a8e99">候选地址（有序 · 首选自动置顶）</text>
    <rect x="272" y="126" width="176" height="28" rx="9" fill="#ffffff" stroke="#22a35a" stroke-width="1.3"/>
    <text x="282" y="144" font-size="9" fill="#22a35a">↑</text>
    <text x="294" y="144" font-size="9.5" fill="#23262e">192.168.1.10:12300</text>
    <circle cx="416" cy="140" r="3" fill="#22a35a"/><text x="440" y="144" text-anchor="end" font-size="8" fill="#22a35a">18ms</text>

    <rect x="272" y="160" width="176" height="28" rx="9" fill="#ffffff" stroke="#e1e3ea"/>
    <text x="282" y="178" font-size="9" fill="#c0c3cb">≡</text>
    <text x="294" y="178" font-size="9.5" fill="#23262e">10.8.0.2:12300</text>
    <circle cx="416" cy="174" r="3" fill="#c0c3cb"/><text x="440" y="178" text-anchor="end" font-size="8" fill="#8a8e99">—</text>

    <rect x="272" y="194" width="176" height="28" rx="9" fill="#ffffff" stroke="#e1e3ea"/>
    <text x="282" y="212" font-size="9" fill="#c0c3cb">≡</text>
    <text x="294" y="212" font-size="9.5" fill="#23262e">ddns.example.com:12300</text>
    <circle cx="416" cy="208" r="3" fill="#e07a1f"/><text x="440" y="212" text-anchor="end" font-size="8" fill="#e07a1f">超时</text>

    <text x="360" y="240" text-anchor="middle" font-size="9" fill="#3b76d2">＋ 添加候选地址</text>

    <text x="272" y="268" font-size="8.5" fill="#8a8e99">多网卡探测</text>
    <rect x="272" y="276" width="86" height="26" rx="8" fill="#22a35a"/>
    <text x="315" y="293" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">并发</text>
    <rect x="362" y="276" width="86" height="26" rx="8" fill="#ffffff" stroke="#e1e3ea"/>
    <text x="405" y="293" text-anchor="middle" font-size="9.5" fill="#8a8e99">串行</text>

    <text x="272" y="322" font-size="8.5" fill="#8a8e99">并发：同探全部地址，取延迟最低（默认）</text>
    <text x="272" y="336" font-size="8.5" fill="#8a8e99">串行：按顺序逐个探，第一个通的用之</text>
    <text x="272" y="356" font-size="8.5" fill="#8a8e99">前台每 10s 心跳，连续 2 次失败判离线，</text>
    <text x="272" y="368" font-size="8.5" fill="#8a8e99">上线立即亮；顶部标签状态同源。</text>

    <text x="360" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3a3d45">② 候选地址 / 探测模式</text>
  </g>

  <!-- ═══ ③ 经由跳板机 / 隧道 ═══ -->
  <g>
    <rect x="488" y="56" width="216" height="396" rx="28" fill="#ffffff" stroke="#d9dce3" stroke-width="1.5"/>
    <rect x="496" y="64" width="200" height="380" rx="22" fill="#f3f4f8"/>
    <path d="M496 100 h200" stroke="#e4e6ec"/>
    <text x="596" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262e">编辑电脑</text>

    <text x="508" y="118" font-size="8.5" fill="#8a8e99">经由跳板机（外网连内网）</text>
    <rect x="508" y="126" width="176" height="26" rx="8" fill="#ffffff" stroke="#22a35a" stroke-width="1.3"/>
    <text x="518" y="143" font-size="9.5" fill="#23262e">书房 NAS（SSH · 22）</text>
    <text x="674" y="143" text-anchor="end" font-size="9" fill="#8a8e99">▾</text>
    <rect x="508" y="158" width="176" height="24" rx="8" fill="#eef0f5"/>
    <text x="596" y="174" text-anchor="middle" font-size="9" fill="#3c4048">不经由（直连 · 默认）</text>

    <rect x="508" y="194" width="176" height="66" rx="9" fill="#ffffff" stroke="#e1e3ea"/>
    <text x="518" y="210" font-size="8.5" fill="#8a8e99">选定后自动建立本地转发：</text>
    <g font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#4a4e58">
      <text x="518" y="226">手机 127.0.0.1:随机端口</text>
      <text x="518" y="240">　→ 跳板机 direct-tcpip</text>
      <text x="518" y="254">　→ 192.168.1.10:12300</text>
    </g>

    <text x="508" y="282" font-size="8.5" fill="#8a8e99">WebView / API / 心跳所有交互请求都走该</text>
    <text x="508" y="294" font-size="8.5" fill="#8a8e99">隧道；此时地址填「跳板机视角的内网地址」。</text>

    <rect x="508" y="308" width="176" height="40" rx="9" fill="#fdf3e7"/>
    <text x="518" y="324" font-size="8.5" fill="#9a6b1f">隧道断开：指数退避重连 1s→60s，</text>
    <text x="518" y="338" font-size="8.5" fill="#9a6b1f">心跳探不通时标签置灰并提示。</text>

    <rect x="508" y="362" width="176" height="28" rx="9" fill="#22a35a"/>
    <text x="596" y="380" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">保存</text>

    <text x="596" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3a3d45">③ 经由跳板机 / 隧道语义</text>
  </g>
</svg>
