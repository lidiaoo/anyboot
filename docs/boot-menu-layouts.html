<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnyBoot · 多引导器菜单 10 种排版方案</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   0. 设计令牌 —— 与 src-tauri/ui/styles.css 同源（暗色为默认）
   这里多一层 --panel-2/3/4 与 --mono，仅供设计稿使用；落地时映射回
   现有的 --panel / --border / --text-dim / --text-faint。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --font:"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"SF Mono",monospace;
  --bg:#020617;
  --panel:#0b1020;
  --panel-2:#111830;
  --panel-3:#18213a;
  --panel-4:#1f2a45;
  --line:#232b42;
  --line-2:#334155;
  --line-3:#4a5a75;
  --text:#f8fafc;
  --dim:#a6b3c6;
  --faint:#7f8da3;
  --fainter:#5c6a80;
  --accent:#6366f1;
  --accent-2:#818cf8;
  --accent-soft:rgba(99,102,241,.15);
  --ok:#22c55e;
  --ok-text:#4ade80;
  --warn:#f59e0b;
  --warn-text:#fbbf24;
  --danger:#ef4444;
  --danger-text:#fca5a5;
  --info:#38bdf8;
  --info-text:#7dd3fc;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --r:10px;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#eef1f7;
  --panel:#ffffff;
  --panel-2:#f5f7fb;
  --panel-3:#e9eef6;
  --panel-4:#dde5f0;
  --line:#dde3ec;
  --line-2:#c3cddb;
  --line-3:#9dabbd;
  --text:#0f172a;
  --dim:#41506a;
  --faint:#5b6a80;
  --fainter:#7a8899;
  --accent:#4f46e5;
  --accent-2:#4338ca;
  --accent-soft:rgba(79,70,229,.10);
  --ok:#15803d;
  --ok-text:#15803d;
  --warn:#b45309;
  --warn-text:#b45309;
  --danger:#b91c1c;
  --danger-text:#b91c1c;
  --info:#0369a1;
  --info-text:#0369a1;
  --shadow:0 18px 40px rgba(15,23,42,.14);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:13px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,pre{margin:0}
a{color:var(--accent-2)}
::selection{background:var(--accent-soft)}

/* 滚动条：窄、低对比，不抢视觉 */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ═══════════════════════════════════════════════════════════════════
   1. 展台外壳（不是产品界面，是设计稿的相框）
   ═══════════════════════════════════════════════════════════════════ */
.shell{display:flex;height:100vh;overflow:hidden}
.rail{
  width:214px;flex:none;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);
}
.rail-head{display:flex;gap:10px;align-items:center;padding:14px 14px 10px}
.rail-logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:grid;place-items:center;font:700 12px var(--mono);letter-spacing:.04em;
  color:#fff;background:linear-gradient(145deg,#6366f1,#4338ca);
  box-shadow:0 4px 14px rgba(99,102,241,.4);
}
.rail-head b{display:block;font-size:12.5px}
.rail-head small{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
.rail-tabs{display:flex;gap:4px;padding:0 12px 10px}
.rail-tab{
  flex:1;height:26px;border:1px solid transparent;border-radius:7px;background:transparent;
  color:var(--faint);font-size:11.5px;cursor:pointer;white-space:nowrap;
}
.rail-tab:hover{color:var(--text);background:var(--panel-2)}
.rail-tab.is-on{background:var(--panel-3);color:var(--text);border-color:var(--line)}
.rail-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.rail-item{
  display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  padding:7px 8px;border:1px solid transparent;border-radius:8px;
  background:transparent;cursor:pointer;
}
.rail-item:hover{background:var(--panel-2)}
.rail-item.is-on{background:var(--panel-3);border-color:var(--line-2)}
.rail-idx{
  width:19px;height:19px;flex:none;border-radius:6px;display:grid;place-items:center;
  font:600 10px var(--mono);color:var(--dim);background:var(--panel-3);border:1px solid var(--line);
}
.rail-item.is-on .rail-idx{background:var(--accent);border-color:var(--accent);color:#fff}
.rail-item .rt-wrap{flex:1;min-width:0;display:block}
.rail-item .rt{display:block;font-size:12px;font-weight:600;line-height:1.3}
.rail-item .rs{display:block;font-size:10.5px;color:var(--faint);line-height:1.35;margin-top:1px}
.rail-foot{flex:none;padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rail-foot .row2{display:flex;gap:6px}
.rail-foot .row2 .btn{flex:1;justify-content:center}
#widthBtns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#widthBtns .btn{width:100%;justify-content:center}
.rail-foot .lbl{font-size:10px;color:var(--fainter);letter-spacing:.06em;text-transform:uppercase}

.stage-col{flex:1;min-width:0;display:flex;flex-direction:column}
.stage-head{
  flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.stage-head .tt{flex:1;min-width:0}
.stage-head h1{font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.stage-head p{font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kicker{font:600 10px var(--mono);letter-spacing:.08em;color:var(--accent-2);text-transform:uppercase}
.stage{
  flex:1;min-height:0;overflow:auto;padding:22px;
  display:flex;justify-content:center;align-items:flex-start;
  background:
    radial-gradient(900px 400px at 50% 0%, var(--accent-soft), transparent 70%),
    var(--bg);
}

/* 模拟应用窗口 */
.win{
  width:var(--w,1180px);max-width:100%;flex:none;
  display:flex;flex-direction:column;
  background:var(--bg);border:1px solid var(--line-2);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden;
}
.win-bar{
  flex:none;height:36px;display:flex;align-items:center;gap:9px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.win-dots{display:flex;gap:5px}
.win-dots i{width:9px;height:9px;border-radius:50%;background:var(--line-3)}
.win-title{font-size:11.5px;color:var(--dim);font-weight:500}
.win-tag{margin-left:auto;font:10px var(--mono);color:var(--fainter);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.win-body{
  container-type:inline-size;container-name:view;
  height:min(720px,calc(100vh - 180px));min-height:440px;
  overflow:auto;padding:16px;
  background:var(--bg);
}
.win-body.no-pad{padding:0}

/* ═══════════════════════════════════════════════════════════════════
   2. 说明面板
   ═══════════════════════════════════════════════════════════════════ */
.notes{
  width:368px;flex:none;overflow-y:auto;background:var(--panel);
  border-left:1px solid var(--line);padding:16px 16px 40px;
}
.notes.is-off{display:none}
/* 窄一点的屏幕上，说明面板改成覆盖式抽屉，把整幅宽度让给展台 */
@media (max-width:1520px){
  .notes{
    position:fixed;top:0;right:0;bottom:0;width:372px;z-index:80;
    box-shadow:-24px 0 60px rgba(0,0,0,.45);
  }
}
.notes h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.notes .sub{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.55}
.nsec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.nsec:first-of-type{border-top:0}
.nsec h4{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fainter);
  display:flex;align-items:center;gap:6px;margin-bottom:7px;
}
.nsec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.nsec p{font-size:12px;color:var(--dim);line-height:1.6}
.nsec p + p{margin-top:6px}
.tree{
  font:10.5px/1.65 var(--mono);color:var(--dim);background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;overflow-x:auto;white-space:pre;
}
.tree em{color:var(--accent-2);font-style:normal}
.tree b{color:var(--text);font-weight:600}
.nlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.nlist li{font-size:11.5px;color:var(--dim);line-height:1.55;padding-left:14px;position:relative}
.nlist li::before{content:"";position:absolute;left:4px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--line-3)}
.nlist li b{color:var(--text);font-weight:600}
.nlist li code,code.inl{
  font:10.5px var(--mono);background:var(--panel-3);color:var(--dim);
  padding:1px 4px;border-radius:4px;border:1px solid var(--line);
}
.nlist li em{color:var(--warn-text);font-style:normal}
.kv{display:flex;flex-direction:column;gap:5px}
.kv .k{font-size:11px;color:var(--faint)}
.pill-row{display:flex;flex-wrap:wrap;gap:5px}
.pro-con{display:flex;flex-direction:column;gap:6px;font-size:11.5px;line-height:1.5}
.pro-con .p{color:var(--ok-text)}
.pro-con .c{color:var(--warn-text)}
.pro-con b{color:var(--text)}

/* 对比表（总览用） */
.cmp{width:100%;border-collapse:collapse;font-size:11px;margin-top:2px}
.cmp th,.cmp td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{color:var(--fainter);font-weight:600;font-size:10px;letter-spacing:.04em}
.cmp td{color:var(--dim)}
.cmp td:first-child{color:var(--text);font-weight:600;white-space:nowrap}
.cmp tr:hover td{background:var(--panel-2)}

/* ═══════════════════════════════════════════════════════════════════
   3. 通用组件（11 个方案共用的一套原子）
   ═══════════════════════════════════════════════════════════════════ */
.ldr{
  --c:#6366f1;
  width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;
  font:700 10.5px var(--mono);letter-spacing:.02em;color:var(--c);
  background:color-mix(in srgb,var(--c) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
}
.ldr.sm{width:22px;height:22px;border-radius:6px;font-size:8.5px}
.ldr.md{width:26px;height:26px;border-radius:7px;font-size:9.5px}
.ldr.lg{width:36px;height:36px;border-radius:10px;font-size:12px}

.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--faint)}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.off{background:var(--line-3)}
.dot.err{background:var(--danger)}
.dot.live{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

.chip{
  display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;
  border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);
  color:var(--dim);font-size:10.5px;white-space:nowrap;flex:none;
}
.chip.ok{color:var(--ok-text);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.chip.warn{color:var(--warn-text);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.off{color:var(--faint)}
.chip.elev{color:#c7b9ff;border-color:rgba(167,139,250,.36);background:rgba(167,139,250,.12)}
[data-theme="light"] .chip.elev{color:#5b21b6}

.badge{
  display:inline-flex;align-items:center;gap:4px;height:17px;padding:0 5px;border-radius:5px;
  font-size:10px;background:var(--panel-3);color:var(--dim);border:1px solid transparent;white-space:nowrap;flex:none;
}
.badge.def{color:var(--ok-text);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.badge.last{color:var(--info-text);background:color-mix(in srgb,var(--info) 12%,transparent)}
.badge.pin{color:var(--accent-2);background:var(--accent-soft)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--text);font-size:12px;font-weight:500;
  cursor:pointer;white-space:nowrap;flex:none;
  transition:background .13s,border-color .13s,color .13s,box-shadow .13s;
}
.btn:hover{background:var(--panel-3);border-color:var(--line-3)}
.btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.danger{color:var(--danger-text);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.btn.sm{height:24px;padding:0 8px;font-size:11px;border-radius:6px;gap:4px}
.btn.xs{height:20px;padding:0 6px;font-size:10.5px;border-radius:5px;gap:3px}
.btn.icon{width:26px;padding:0}
.btn.icon.sm{width:22px}
.btn[disabled],.btn.is-disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn .elev{font-size:10px;opacity:.9}

.seg{display:inline-flex;padding:2px;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;flex:none}
.seg button{
  height:22px;padding:0 8px;border:1px solid transparent;border-radius:6px;
  background:transparent;color:var(--faint);font-size:11px;cursor:pointer;
}
.seg button:hover{color:var(--text)}
.seg button.is-on{background:var(--panel-4);color:var(--text);border-color:var(--line-2)}

.search{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;color:var(--faint);
  min-width:0;flex:1;
}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);
  font:12px var(--font);
}
.search input::placeholder{color:var(--fainter)}
.kbd{
  display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;
  font:10px var(--mono);color:var(--dim);background:var(--panel-3);
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;flex:none;
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-head{flex:none;display:flex;align-items:center;gap:9px;padding:11px 12px}
.card-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.card-title b{font-size:13px;font-weight:650;letter-spacing:-.01em}
.card-title small{font-size:10.5px;color:var(--faint);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.entries{display:flex;flex-direction:column;gap:1px;padding:0 6px 8px}
.row{
  display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:8px;
  border:1px solid transparent;min-width:0;
}
.row:hover{background:var(--panel-2)}
.row.is-def{background:color-mix(in srgb,var(--ok) 7%,transparent);border-color:color-mix(in srgb,var(--ok) 20%,transparent)}
.row-ico{
  width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;
  font:600 8.5px var(--mono);letter-spacing:.02em;
  background:var(--panel-3);color:var(--dim);
}
.row-ico.mac{color:#c4b5fd;background:rgba(167,139,250,.14)}
.row-ico.win{color:#93c5fd;background:rgba(96,165,250,.14)}
.row-ico.lin{color:#fcd34d;background:rgba(245,158,11,.14)}
.row-ico.tool{color:#94a3b8;background:rgba(148,163,184,.12)}
.row-ico.fw{color:#7dd3fc;background:rgba(56,189,248,.12)}
[data-theme="light"] .row-ico.mac{color:#6d28d9;background:rgba(109,40,217,.10)}
[data-theme="light"] .row-ico.win{color:#1d4ed8;background:rgba(29,78,216,.10)}
[data-theme="light"] .row-ico.lin{color:#92400e;background:rgba(180,83,9,.10)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{
  font:10.5px var(--mono);color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-acts{display:flex;align-items:center;gap:5px;flex:none;opacity:.5;transition:opacity .12s}
.row:hover .row-acts,.row:focus-within .row-acts{opacity:1}
@media (hover:none){.row-acts{opacity:1}}

.sep{height:1px;background:var(--line);margin:0}

.acc{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;
  border:0;border-top:1px solid var(--line);background:transparent;color:var(--dim);
  font-size:11.5px;cursor:pointer;text-align:left;
}
.acc:hover{background:var(--panel-2);color:var(--text)}
.acc .grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;overflow:hidden}
.acc .grow > span{white-space:nowrap;flex:none}
.acc small{color:var(--fainter);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acc .car{transition:transform .15s}
.acc[aria-expanded="true"] .car{transform:rotate(180deg)}

.panel-in{
  padding:2px 12px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;border-top:1px solid transparent;
}
.set{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line);min-width:0;
}
.set .set-t{flex:1;min-width:0}
.set .set-t b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .set-t small{display:block;font:10px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.switch{width:30px;height:17px;border-radius:9px;background:var(--panel-4);border:1px solid var(--line-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--faint);transition:.15s}
.switch.on{background:color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
.switch.on::after{left:15px;background:#fff}

.toolbar{display:flex;align-items:center;gap:7px;flex:none;min-width:0}
.toolbar .grow{flex:1;min-width:0}
.mut{color:var(--faint)}
.hint{font-size:10.5px;color:var(--fainter)}

.ico-cell{display:grid;place-items:center;color:var(--dim)}
svg.i{display:block;width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:12px;height:12px}
svg.i.lg{width:16px;height:16px}

/* 空态 */
.empty{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 12px;
  color:var(--faint);font-size:12px;text-align:center;
}
.empty b{color:var(--text);font-size:13px}

/* ═══════════════════════════════════════════════════════════════════
   4. 方案 A —— 卡片流 + 顶部通道索引
   ═══════════════════════════════════════════════════════════════════ */
.la{display:flex;flex-direction:column;height:100%;min-height:0}
.la-index{
  flex:none;position:sticky;top:-16px;z-index:3;margin:-16px -16px 12px;padding:9px 16px;
  display:flex;align-items:center;gap:6px;overflow-x:auto;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.la-chip{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;
  border:1px solid transparent;background:transparent;color:var(--dim);font-size:11px;cursor:pointer;flex:none;
}
.la-chip:hover{background:var(--panel-2);color:var(--text)}
.la-chip.is-on{background:var(--panel-2);border-color:var(--line-2);color:var(--text)}
.la-chip em{font:10px var(--mono);color:var(--fainter);font-style:normal}
.la-star{color:var(--accent-2)}
.la-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.la-card{flex:none}
.la-card .card-head{border-bottom:1px solid transparent}
.la-card .card-head:hover{border-bottom-color:var(--line)}
.la-card.is-pinned{border-color:color-mix(in srgb,var(--accent) 34%,var(--line))}
.la-card.is-pinned .card-head{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.la-foot{
  flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);
  font-size:11px;color:var(--faint);background:var(--panel-2);
}
.la-more{
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;
  border:1px dashed var(--line-2);color:var(--faint);font-size:11.5px;background:transparent;cursor:pointer;text-align:left;
}
.la-more:hover{border-color:var(--line-3);color:var(--dim)}
.la-more b{color:var(--dim);font-weight:600}

/* ═══════════════════════════════════════════════════════════════════
   5. 方案 B —— 左栏通道 + 右栏详情（主从）
   ═══════════════════════════════════════════════════════════════════ */
.lb{display:flex;height:100%;min-height:0;margin:-16px;background:var(--panel)}
.lb-nav{
  width:236px;flex:none;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--panel-2);
}
.lb-nav-head{
  flex:none;display:flex;align-items:center;gap:6px;padding:12px 10px 8px;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fainter);
}
.lb-nav-head .grow{flex:1}
.lb-list{flex:1;min-height:0;overflow-y:auto;padding:0 6px 8px;display:flex;flex-direction:column;gap:1px}
.lb-item{
  display:flex;align-items:center;gap:8px;padding:7px 7px;border-radius:8px;border:1px solid transparent;
  background:transparent;cursor:pointer;text-align:left;width:100%;color:inherit;min-width:0;
}
.lb-item:hover{background:var(--panel-3)}
.lb-item.is-on{background:var(--panel);border-color:var(--line-2);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.lb-item .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.lb-item .nm b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-item .nm small{font-size:10px;color:var(--fainter);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-grip{color:var(--fainter);opacity:0;cursor:grab;flex:none}
.lb-item:hover .lb-grip{opacity:1}
.lb-item.is-on .lb-grip{opacity:.7}
.lb-nav-foot{flex:none;padding:8px 8px;border-top:1px solid var(--line);display:flex;gap:6px}
.lb-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lb-main-head{
  flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  border-bottom:1px solid var(--line);background:var(--bg);
}
.lb-main-head .tt{flex:1;min-width:0}
.lb-main-head h2{font-size:15px;font-weight:650;display:flex;align-items:center;gap:7px}
.lb-main-head p{font:11px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 16px}
.lb-note{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;margin-bottom:12px;
  background:var(--panel);border:1px solid var(--line);font-size:11.5px;color:var(--dim);
}
.lb-note b{color:var(--text);font-weight:600}
.lb-block{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.lb-block-head{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--dim);width:100%;border-left:0;border-right:0;border-top:0;
  background:transparent;text-align:left;cursor:pointer;font-family:inherit;
}
.lb-block-head:hover{background:var(--panel-2)}
.lb-block-head b{color:var(--text);font-size:12px;font-weight:600}
.lb-block-body{padding:6px}
.lb-set{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;padding:8px}

/* ═══════════════════════════════════════════════════════════════════
   6. 方案 C —— 顶部固定标签页
   ═══════════════════════════════════════════════════════════════════ */
.lc{display:flex;flex-direction:column;height:100%;min-height:0;margin:-16px}
.lc-tabs{
  flex:none;display:flex;align-items:stretch;gap:2px;padding:7px 10px 0;
  border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none;
}
.lc-tabs::-webkit-scrollbar{display:none}
.lc-tab{
  display:flex;align-items:center;gap:6px;height:31px;padding:0 10px;flex:none;
  border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;
  background:transparent;color:var(--faint);font-size:11.5px;cursor:pointer;position:relative;
}
.lc-tab:hover{background:var(--panel-2);color:var(--text)}
.lc-tab.is-on{
  background:var(--bg);border-color:var(--line);color:var(--text);
  margin-bottom:-1px;padding-bottom:1px;
}
.lc-tab.is-on::after{content:"";position:absolute;left:8px;right:8px;top:0;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.lc-tab .pin{color:var(--accent-2)}
.lc-tab em{font:9.5px var(--mono);color:var(--fainter);font-style:normal}
.lc-tabadd{width:26px;height:26px;align-self:center;flex:none}
.lc-toolbar{
  flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;
  border-bottom:1px solid var(--line);background:var(--bg);
}
.lc-body{flex:1;min-height:0;overflow-y:auto;padding:12px 13px}
.lc-settings{flex:none;border-top:1px solid var(--line);background:var(--panel-2)}
.lc-meta{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}

/* ═══════════════════════════════════════════════════════════════════
   7. 方案 D —— 双列自适应网格
   ═══════════════════════════════════════════════════════════════════ */
.ld{display:flex;flex-direction:column;height:100%;min-height:0}
.ld-bar{flex:none;display:flex;align-items:center;gap:7px;margin-bottom:11px}
.ld-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;align-content:start}
.ld-card{display:flex;flex-direction:column;min-width:0}
.ld-card.span{grid-column:1/-1;flex-direction:row;align-items:stretch}
.ld-card.span .ld-left{width:250px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
.ld-card.span .ld-right{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;align-content:start;padding:6px}
.ld-mini{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;min-width:0}
.ld-mini:hover{background:var(--panel-2)}
.ld-mini .t{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-card-head{display:flex;align-items:center;gap:8px;padding:10px 11px;border-bottom:1px solid var(--line)}
.ld-stat{display:flex;align-items:center;gap:10px;padding:7px 11px;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);margin-top:auto}
.ld-stat b{color:var(--dim);font-weight:600}

/* ═══════════════════════════════════════════════════════════════════
   8. 方案 E —— 启动链路时间线
   ═══════════════════════════════════════════════════════════════════ */
.le{display:flex;gap:18px;height:100%;min-height:0}
.le-flow{flex:1;min-width:0;overflow-y:auto;padding-left:2px}
.le-step{display:flex;gap:12px;min-width:0}
.le-rail{width:26px;flex:none;display:flex;flex-direction:column;align-items:center}
.le-num{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;
  font:600 10px var(--mono);color:var(--dim);background:var(--panel-3);border:1px solid var(--line-2);
}
.le-step.hot .le-num{background:var(--accent);border-color:var(--accent);color:#fff}
.le-line{flex:1;width:2px;background:var(--line);margin:4px 0;border-radius:2px}
.le-step.hot .le-line{background:linear-gradient(var(--accent),var(--line))}
.le-card{flex:1;min-width:0;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.le-step.hot .le-card{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 0 1px var(--accent-soft)}
.le-card-head{display:flex;align-items:center;gap:8px;padding:9px 11px}
.le-card-body{border-top:1px solid var(--line);padding:5px}
.le-side{
  width:246px;flex:none;display:flex;flex-direction:column;gap:9px;overflow-y:auto;
}
.le-pred{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 20%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:11px;padding:12px}
.le-pred .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.le-pred .v{font-size:15px;font-weight:650;margin-top:5px}
.le-pred .s{font:10.5px var(--mono);color:var(--faint);margin-top:2px}
.le-pred .acts{display:flex;gap:6px;margin-top:10px}
.le-fact{display:flex;gap:8px;font-size:11px;color:var(--dim);padding:6px 0;border-bottom:1px dashed var(--line)}
.le-fact:last-child{border-bottom:0}
.le-fact b{color:var(--text);font-weight:600;flex:none;width:58px}
.le-fact span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══════════════════════════════════════════════════════════════════
   9. 方案 F —— 矩阵对照表
   ═══════════════════════════════════════════════════════════════════ */
.lf{display:flex;flex-direction:column;height:100%;min-height:0}
.lf-bar{flex:none;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.lf-scroll{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.lf table{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px;min-width:640px}
.lf th,.lf td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.lf thead th{
  position:sticky;top:0;z-index:2;background:var(--panel-2);font-weight:600;font-size:10.5px;
  color:var(--dim);padding:7px 9px;text-align:left;white-space:nowrap;
}
.lf thead th .ldr{display:inline-grid;vertical-align:-6px;margin-right:5px}
.lf tbody th{
  position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;font-weight:600;
  padding:7px 10px;white-space:nowrap;min-width:150px;
}
.lf tbody th small{display:block;font:10px var(--mono);color:var(--fainter);font-weight:400;margin-top:1px}
.lf td{width:112px;text-align:center;color:var(--fainter);padding:5px 6px}
.lf tr:hover td,.lf tr:hover th{background:var(--panel-2)}
.lf td.on{color:var(--ok-text)}
.lf td.on:hover .cellbtn{display:inline-flex}
.lf .cellbtn{
  display:none;align-items:center;gap:4px;height:21px;padding:0 6px;border-radius:5px;
  border:1px solid var(--line-2);background:var(--panel-3);color:var(--text);font-size:10.5px;cursor:pointer;
}
.lf td.on:hover .cellbtn{display:inline-flex}
.lf .cellmark{display:inline-flex;align-items:center;gap:4px;font-size:10.5px}
.lf td.on:hover .cellmark{display:none}
.lf-legend{flex:none;display:flex;align-items:center;gap:12px;padding-top:9px;font-size:10.5px;color:var(--faint)}
.lf-legend span{display:flex;align-items:center;gap:5px}

/* ═══════════════════════════════════════════════════════════════════
   10. 方案 G —— 命令面板
   ═══════════════════════════════════════════════════════════════════ */
.lg{display:flex;gap:0;height:100%;min-height:0;margin:-16px;background:var(--panel)}
.lg-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.lg-top{
  flex:none;padding:14px 14px 10px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px;background:var(--panel);
}
.lg-search{
  display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.lg-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:13.5px var(--font)}
.lg-search input::placeholder{color:var(--fainter)}
.lg-filters{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.lg-filters::-webkit-scrollbar{display:none}
.lg-fchip{
  display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border-radius:6px;
  border:1px solid var(--line);background:transparent;color:var(--faint);font-size:10.5px;cursor:pointer;flex:none;
}
.lg-fchip:hover{color:var(--text);border-color:var(--line-2)}
.lg-fchip.is-on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-2)}
.lg-results{flex:1;min-height:0;overflow-y:auto;padding:6px}
.lg-group{
  display:flex;align-items:center;gap:6px;padding:7px 8px 4px;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fainter);
}
.lg-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;
  border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:inherit;min-width:0;
}
.lg-item:hover,.lg-item.is-active{background:var(--panel-2);border-color:var(--line)}
.lg-item.is-active{box-shadow:inset 2px 0 0 var(--accent)}
.lg-item .t{flex:1;min-width:0;display:flex;flex-direction:column}
.lg-item .t b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-item .t small{font:10.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-foot{
  flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--faint);background:var(--panel-2);flex-wrap:wrap;
}
.lg-foot span{display:flex;align-items:center;gap:5px}
.lg-side{
  width:258px;flex:none;border-left:1px solid var(--line);background:var(--panel-2);
  padding:13px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
}
.lg-side h4{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fainter)}

/* ═══════════════════════════════════════════════════════════════════
   11. 方案 H —— 手风琴紧凑列表
   ═══════════════════════════════════════════════════════════════════ */
.lh{display:flex;flex-direction:column;height:100%;min-height:0}
.lh-bar{flex:none;display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:11px;color:var(--faint)}
.lh-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.lh-item{border:1px solid transparent;border-radius:9px;overflow:hidden}
.lh-item.is-open{background:var(--panel);border-color:var(--line)}
.lh-head{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:9px;
  border:0;background:transparent;cursor:pointer;text-align:left;color:inherit;min-width:0;
}
.lh-head:hover{background:var(--panel-2)}
.lh-item.is-open .lh-head{border-radius:9px 9px 0 0;border-bottom:1px solid var(--line);background:var(--panel-2)}
.lh-head .nm{font-size:12.5px;font-weight:600;flex:none}
.lh-head .meta{flex:1;min-width:0;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh-body{padding:4px 6px 6px}
.lh-body .row{padding:5px 6px}
.lh-foot{display:flex;align-items:center;gap:8px;padding:6px 9px 2px;border-top:1px dashed var(--line);margin-top:2px}

/* ═══════════════════════════════════════════════════════════════════
   12. 方案 I —— Bento 磁贴 + 底部抽屉
   ═══════════════════════════════════════════════════════════════════ */
.li{display:flex;flex-direction:column;height:100%;min-height:0}
.li-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-content:start}
.li-hero{
  grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;
  padding:15px;border-radius:13px;position:relative;overflow:hidden;
  background:
    radial-gradient(320px 160px at 88% 8%, color-mix(in srgb,var(--accent) 55%,transparent), transparent 70%),
    linear-gradient(155deg,var(--panel-3),var(--panel));
  border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));
}
.li-hero .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
.li-hero .v{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-top:6px}
.li-hero .s{font:11px var(--mono);color:var(--dim);margin-top:3px}
.li-hero .acts{display:flex;gap:7px;margin-top:14px}
.li-tile{
  display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);min-width:0;
}
.li-tile:hover{border-color:var(--line-2)}
.li-tile .top{display:flex;align-items:center;gap:8px}
.li-tile .top .nm{flex:1;min-width:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-tile .big{font:600 19px var(--mono);letter-spacing:-.02em}
.li-tile .big small{font:10px var(--font);color:var(--faint);margin-left:4px}
.li-tile .s{font:10px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-tile .foot{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--faint)}
/* 模拟窗口 ≥900px（.vw-g 由 JS 挂）：磁贴 4 列时最后一块横跨两列 */
.win-body.vw-g .li-grid > .li-tile:last-child{grid-column:span 2}
.li-sheetbar{
  flex:none;display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:11.5px;color:var(--dim);
}
.li-sheetbar .grow{flex:1;min-width:0}

/* ═══════════════════════════════════════════════════════════════════
   13. 方案 J —— 三栏工作台
   ═══════════════════════════════════════════════════════════════════ */
.lj{display:flex;height:100%;min-height:0;margin:-16px;background:var(--bg)}
.lj-c1{width:190px;flex:none;border-right:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;min-height:0}
.lj-c1 .hd{flex:none;padding:11px 10px 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fainter)}
.lj-nav{flex:1;min-height:0;overflow-y:auto;padding:0 6px 8px;display:flex;flex-direction:column;gap:1px}
.lj-navi{display:flex;align-items:center;gap:8px;padding:7px;border-radius:7px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:inherit;width:100%;min-width:0}
.lj-navi:hover{background:var(--panel-3)}
.lj-navi.is-on{background:var(--panel);border-color:var(--line-2)}
.lj-navi .nm{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lj-c2{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.lj-c2 .hd{flex:none;display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.lj-c2 .bd{flex:1;min-height:0;overflow-y:auto;padding:8px}
.lj-c3{
  width:268px;flex:none;border-left:1px solid var(--line);background:var(--panel-2);
  display:flex;flex-direction:column;min-height:0;transition:width .16s ease;
}
.lj-c3.folded{width:42px}
.lj-c3 .hd{flex:none;display:flex;align-items:center;gap:7px;padding:11px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim)}
.lj-c3 .bd{flex:1;min-height:0;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px}
.lj-c3.folded .bd,.lj-c3.folded .hd span,.lj-c3.folded .hd b{display:none}
.lj-c3.folded .hd{justify-content:center;padding:11px 0}
.lj-setgroup{display:flex;flex-direction:column;gap:5px}
.lj-setgroup .gt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fainter);padding:2px 2px}

/* ═══════════════════════════════════════════════════════════════════
   13.5 方案 K —— 系统引导高级设置（区域编排）
   用户自选展示哪些引导器（rEFInd / GRUB / OpenCore / Clover /
   systemd-boot），分进两个区域；区域之间 左右/上下，区域内部再各选
   上下/左右 —— 方向全是数据（.h/.v 类），全程 flex，无绝对定位。
   ═══════════════════════════════════════════════════════════════════ */
.k{display:flex;flex-direction:column;height:100%;min-height:0;gap:10px}
.k-bar{
  flex:none;display:flex;flex-direction:column;gap:7px;padding:9px 11px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel);
}
.k-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.k-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fainter);flex:none;min-width:62px}
.k-chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 3px 0 5px;
  border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);
  color:var(--dim);font-size:11.5px;cursor:pointer;flex:none;user-select:none;
}
.k-chip:hover{border-color:var(--line-3);color:var(--text)}
.k-chip.is-on{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,var(--line-2));background:color-mix(in srgb,var(--accent) 12%,transparent)}
.k-chip.is-off{opacity:.6}
.k-rg{
  height:18px;padding:0 5px;margin-left:1px;border-radius:5px;border:0;cursor:pointer;
  font:600 9.5px var(--mono);letter-spacing:.04em;
  background:var(--panel-4);color:var(--faint);
}
.k-rg:hover{color:var(--text);background:var(--panel-3)}
.k-stage{flex:1;min-height:0;display:flex;gap:10px}
.k-stage.h{flex-direction:row}
.k-stage.v{flex-direction:column}
.k-region{
  flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
  border:1px dashed var(--line-2);border-radius:11px;
  background:color-mix(in srgb,var(--panel) 55%,transparent);
}
.k-rhd{
  flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;
  border-bottom:1px dashed var(--line-2);font-size:11px;color:var(--faint);
  min-width:0;flex-wrap:wrap;
}
.k-rhd b{color:var(--dim);font-weight:600}
.k-rhd .grow{flex:1;min-width:0}
.k-rbody{flex:1;min-height:0;display:flex;gap:9px;padding:9px}
.k-rbody.h{flex-direction:row}
.k-rbody.v{flex-direction:column}
.k-rbody.is-empty{align-items:center;justify-content:center}
.k-card{
  flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.k-card-head{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);min-width:0}
.k-card-head .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-entries{flex:1;min-height:0;overflow-y:auto;padding:2px 6px 6px}
.k-empty-hint{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--fainter);font-size:11.5px;text-align:center;padding:10px}

/* ═══════════════════════════════════════════════════════════════════
   14. 容器断点：所有方案共用同一套断点（模拟窗口变窄时的行为）
   用 JS ResizeObserver 往 .win-body 挂 .vw-900/.vw-760/.vw-520/.vw-g
   再配类选择器，而不是 @container —— 老WebView/旧Edge 没有 container
   queries 时整套自适应会整体失效，类断点在任何内核都成立。
   ═══════════════════════════════════════════════════════════════════ */
/* 展台本身在窄屏上收一收，别把中间挤没（这是真实视口，媒体查询没问题） */
@media (max-width:1080px){
  .rail{width:168px}
  .rail-item .rs{display:none}
  .rail-head small{display:none}
  .stage{padding:14px}
  .stage-head{padding:10px 14px}
}
/* ── ≤900px：侧栏收窄 ── */
.win-body.vw-900 .lb-nav{width:200px}
.win-body.vw-900 .le-side{width:210px}
.win-body.vw-900 .lg-side{width:220px}
.win-body.vw-900 .lj-c1{width:160px}
.win-body.vw-900 .lj-c3{width:230px}
.win-body.vw-900 .li-grid{grid-template-columns:repeat(2,1fr)}
.win-body.vw-900 .li-hero{grid-column:span 2;grid-row:span 1}
.win-body.vw-900 .k-stage.h{flex-direction:column}
/* ── ≤760px：上下结构 / 横滑条 ── */
.win-body.vw-760 .notes-wide{display:none}
.win-body.vw-760 .lb{flex-direction:column}
.win-body.vw-760 .lb-nav{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line)}
.win-body.vw-760 .lb-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 8px 8px;gap:5px}
.win-body.vw-760 .lb-item{width:auto;flex:none;padding:6px 8px;border:1px solid var(--line);background:var(--panel)}
.win-body.vw-760 .lb-item .nm small{display:none}
.win-body.vw-760 .lb-grip{display:none}
.win-body.vw-760 .lb-nav-head,.win-body.vw-760 .lb-nav-foot{display:none}
.win-body.vw-760 .le{flex-direction:column}
.win-body.vw-760 .le-side{width:auto;flex-direction:row;overflow-x:auto;overflow-y:visible}
.win-body.vw-760 .le-pred{min-width:210px}
.win-body.vw-760 .lg{flex-direction:column}
.win-body.vw-760 .lg-side{display:none}
.win-body.vw-760 .lj-c1{width:60px}
.win-body.vw-760 .lj-c1 .hd{display:none}
.win-body.vw-760 .lj-navi .nm,.win-body.vw-760 .lj-navi .ldr{display:none}
.win-body.vw-760 .lj-navi{justify-content:center}
.win-body.vw-760 .lj-c3{position:absolute;right:0;top:0;bottom:0;width:250px;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
.win-body.vw-760 .lj{position:relative;overflow:hidden}
.win-body.vw-760 .la-index{top:-16px}
.win-body.vw-760 .ld-card.span{flex-direction:column}
.win-body.vw-760 .ld-card.span .ld-left{width:auto;border-right:0;border-bottom:1px solid var(--line)}
.win-body.vw-760 .li-grid{grid-template-columns:1fr 1fr}
.win-body.vw-760 .li-hero{grid-column:span 2}
.win-body.vw-760 .win-body{padding:12px}
.win-body.vw-760{padding:12px}
.win-body.vw-760 .la-index{margin:-12px -12px 10px;padding:8px 12px;top:-12px}
.win-body.vw-760 .lc,.win-body.vw-760 .lb,.win-body.vw-760 .lj,.win-body.vw-760 .lg{margin:-12px}
.win-body.vw-760 .lc-body,.win-body.vw-760 .lb-scroll{padding:10px}
/* ── ≤520px：手机 ── */
.win-body.vw-520 .li-grid{grid-template-columns:1fr}
.win-body.vw-520 .li-hero{grid-column:span 1}
.win-body.vw-520 .lj-c1{display:none}
.win-body.vw-520 .lc-toolbar .hide-sm{display:none}
.win-body.vw-520 .lb-main-head{padding:11px 12px}
.win-body.vw-520 .ld-grid{grid-template-columns:1fr}
.win-body.vw-520 .la-index .la-chip span.nm{display:none}
.win-body.vw-520 .lf table{min-width:520px}
.win-body.vw-520 .le-pred .v{font-size:14px}
.win-body.vw-520 .k-rbody.h{flex-direction:column}

/* ═══════════════════════════════════════════════════════════════════
   15. 组件规格页 / 逻辑图页 / 总览页
   ═══════════════════════════════════════════════════════════════════ */
.spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
.spec.wide{grid-column:1/-1}
.spec{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
.spec h3{font-size:12px;font-weight:650;padding:9px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.spec h3 small{font:10px var(--mono);color:var(--fainter);font-weight:400;margin-left:auto}
.spec-body{padding:11px;display:flex;flex-direction:column;gap:9px}
.spec-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spec-note{font-size:10.5px;color:var(--faint);line-height:1.5}
.spec-note code{font:10px var(--mono);color:var(--dim);background:var(--panel-2);padding:1px 4px;border-radius:4px}

.ov{display:flex;flex-direction:column;gap:14px}
.ov-hero{border:1px solid var(--line);border-radius:12px;padding:16px;background:linear-gradient(150deg,var(--accent-soft),transparent 55%),var(--panel)}
.ov-hero h2{font-size:17px;letter-spacing:-.01em}
.ov-hero p{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.65;max-width:70ch}
.ov-kpis{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.ov-kpi{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--panel-2);min-width:110px}
.ov-kpi b{display:block;font:600 16px var(--mono);letter-spacing:-.02em}
.ov-kpi small{display:block;font-size:10px;color:var(--faint);margin-top:1px}
.ov h3{font-size:12.5px;font-weight:650;margin-bottom:7px}

/* 遮罩层：逻辑图 / 大图 */
.ovl{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(2,6,23,.72);backdrop-filter:blur(6px);padding:24px;
}
.ovl.is-on{display:flex}
.ovl-box{
  width:min(1080px,96vw);height:90vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
}
.ovl-head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ovl-head b{font-size:13px}
.ovl-head .mut{font-size:11px}
.ovl-body{flex:1;min-height:0;overflow:auto;padding:18px}
.ovl-body .diag{margin-bottom:22px}
.ovl-body .diag h4{font-size:12px;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.ovl-body .diag h4 em{font-style:normal;color:var(--fainter);font-size:10.5px;font-weight:400}
.diag svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.diag svg text{font-family:var(--font);font-size:10.5px;fill:var(--dim)}
.diag svg text.t{font-size:12px;font-weight:600;fill:var(--text)}
.diag svg text.m{font-family:var(--mono);font-size:9.5px;fill:var(--faint)}
.diag svg text.b{font-weight:600;fill:var(--text)}

/* 总览对比表的大版本 */
table.big{width:100%;border-collapse:collapse;font-size:11.5px}
table.big th,table.big td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.big th{color:var(--fainter);font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;position:sticky;top:0;background:var(--panel)}
table.big td:first-child{font-weight:600;color:var(--text);white-space:nowrap}
table.big td{color:var(--dim)}
table.big tr:hover td{background:var(--panel-2)}
/* 页头（方案 D/H/I 共用） */
.pg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pg-left{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.pg-left h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.pg-left small{font-size:10.5px;color:var(--faint);white-space:nowrap}
.next-pill{
  display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:9px;min-width:0;
  background:var(--panel);border:1px solid var(--line);
}
.next-pill > svg{color:var(--info);flex:none}
.next-pill .np-k{font-size:10.5px;color:var(--faint);flex:none}
.next-pill b{font-size:12px;font-weight:600;white-space:nowrap}
.next-pill small{font:10px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-acts{display:flex;align-items:center;gap:6px;flex:none}
.grow{flex:1;min-width:0}

/* 弹窗 / 抽屉 / Toast（组件规格页的静态样张） */
.dlg{width:100%;max-width:392px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.55);overflow:hidden}
.dlg-head{padding:14px 15px 0;display:flex;align-items:center;gap:8px}
.dlg-head b{font-size:13.5px;font-weight:650}
.dlg-body{padding:8px 15px 13px;font-size:11.5px;color:var(--dim);line-height:1.62}
.dlg-acts{display:flex;justify-content:flex-end;gap:7px;padding:10px 15px;background:var(--panel-2);border-top:1px solid var(--line)}
.dlg-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--faint)}
.dlg-list li{display:flex;gap:6px;align-items:flex-start}
.toast{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;background:var(--panel-3);border:1px solid var(--line-2);font-size:11.5px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.toast .grow{flex:1;min-width:0}
.mock-scrim{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(600px 200px at 50% 0%,rgba(99,102,241,.14),transparent),var(--panel-2);padding:18px;display:flex;justify-content:center}
.stars{color:var(--accent-2);font-size:10px;letter-spacing:1px;white-space:nowrap}
/* ── 侧栏隐藏：shell 挂 .rail-off，主区占满 ── */
.shell.rail-off .rail{display:none}
.shell.rail-off .stage-col{width:100%}
.rail-fab{
  display:none;position:fixed;left:10px;bottom:10px;z-index:60;
  padding:7px 11px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--panel-3);color:var(--text);font:600 11.5px var(--ui);
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.shell.rail-off .rail-fab{display:block}
.rail-fab:hover{background:var(--panel-2)}
</style>
</head>
<body>
<div class="shell">
  <!-- ── 左：方案目录 ── -->
  <aside class="rail">
    <div class="rail-head">
      <div class="rail-logo">AB</div>
      <div>
        <b>引导菜单排版</b>
        <small>11 方案 · 设计稿 v2</small>
      </div>
    </div>
    <div class="rail-tabs">
      <button class="rail-tab is-on" data-rail="layouts">排版</button>
      <button class="rail-tab" data-rail="specs">组件</button>
      <button class="rail-tab" data-rail="flow">逻辑图</button>
    </div>
    <nav class="rail-list" id="railList"></nav>
    <div class="rail-foot">
      <span class="lbl">窗口宽度模拟</span>
      <div class="row2" id="widthBtns">
        <button class="btn xs ghost" data-w="1180">宽 1180</button>
        <button class="btn xs ghost" data-w="900">中 900</button>
        <button class="btn xs ghost" data-w="620">窄 620</button>
        <button class="btn xs ghost" data-w="430">手机 430</button>
      </div>
      <div class="row2">
        <button class="btn xs ghost" id="themeBtn">切换亮/暗</button>
        <button class="btn xs ghost" id="openFlow">操作逻辑图</button>
      </div>
    </div>
  </aside>

  <button class="rail-fab" id="railFab" title="展开侧栏（快捷键 [ ）">☰ 方案目录</button>

  <!-- ── 中：展台 ── -->
  <main class="stage-col">
    <div class="stage-head">
      <div class="tt">
        <h1><span class="kicker" id="stageKicker">OVERVIEW</span><span id="stageTitle">总览与取舍</span></h1>
        <p id="stageSub">同一份快照，十一种信息架构。</p>
      </div>
      <div class="toolbar">
        <button class="btn sm ghost" id="toggleRail">隐藏侧栏</button>
        <button class="btn sm ghost" id="toggleNotes">隐藏说明</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="win">
        <div class="win-bar">
          <div class="win-dots"><i></i><i></i><i></i></div>
          <span class="win-title">AnyBoot — 引导</span>
          <span class="win-tag" id="winTag">1180 × 600</span>
        </div>
        <div class="win-body" id="view"></div>
      </div>
    </div>
  </main>

  <!-- ── 右：设计说明 ── -->
  <aside class="notes" id="notes"></aside>
</div>

<!-- 逻辑图遮罩 -->
<div class="ovl" id="ovl">
  <div class="ovl-box">
    <div class="ovl-head">
      <b>操作逻辑图</b>
      <span class="mut">数据流 / 一次写入的完整往返 / 编排与折叠 / 危险动作确认</span>
      <span style="margin-left:auto"></span>
      <button class="btn sm" id="ovlClose">关闭</button>
    </div>
    <div class="ovl-body" id="ovlBody"></div>
  </div>
</div>

<script>
(function () {
"use strict";

/* ═══════════════════════════════════════════════════════════════════
   1. 图标（内联 SVG，统一 16 网格 / 1.6 描边）
   不用 emoji：跨平台字形不一致，且无法跟随主题着色。
   ═══════════════════════════════════════════════════════════════════ */
const NS = "http://www.w3.org/2000/svg";
const ICONS = {
  search: '<circle cx="7.2" cy="7.2" r="4.6"/><path d="M10.6 10.6 14 14"/>',
  gear: '<circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/>',
  pin: '<path d="M6.2 2.2h3.6l-.7 3.4 2.4 2.6H4.5l2.4-2.6-.7-3.4Z"/><path d="M8 8.2v5.2"/>',
  grip: '<circle cx="6" cy="4" r="1"/><circle cx="10" cy="4" r="1"/><circle cx="6" cy="8" r="1"/><circle cx="10" cy="8" r="1"/><circle cx="6" cy="12" r="1"/><circle cx="10" cy="12" r="1"/>',
  chevron: '<path d="M4 6.2 8 10l4-3.8"/>',
  more: '<circle cx="3.5" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12.5" cy="8" r="1.1"/>',
  check: '<path d="M3.2 8.4 6.4 11.6 12.8 4.8"/>',
  warn: '<path d="M8 2.6 14 13H2L8 2.6Z"/><path d="M8 6.4v3.2M8 11.4v.1"/>',
  refresh: '<path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.8"/><path d="M13.6 2.4v2.8h-2.8"/>',
  elev: '<circle cx="5.6" cy="5.6" r="2.4"/><path d="M7.4 7.4 13 13"/><path d="M11 13h2v-2"/>',
  plus: '<path d="M8 3.2v9.6M3.2 8h9.6"/>',
  arrow: '<path d="M3.5 8h9M9 4.5 12.5 8 9 11.5"/>',
  x: '<path d="M4 4l8 8M12 4l-8 8"/>',

/* ═══════════════════════════════════════════════════════════════════
   10. 方案 G —— 命令面板（搜索优先 / 键盘流）
   ═══════════════════════════════════════════════════════════════════ */
function viewG() {
  const wrap = n("div", "lg");
  const main = n("div", "lg-main");
  const top = n("div", "lg-top");

  const searchBox = n("div", "lg-search");
  searchBox.append(icon("search", "lg"));
  const input = n("input");
  input.placeholder = "搜索系统、引导器或动作…";
  input.value = "";
  searchBox.append(input, n("span", "kbd", "⌘K"));
  top.append(searchBox);

  const filters = n("div", "lg-filters");
  const fdefs = [{ id: "all", label: "全部 16" }, { id: "pin", label: "已固定 1" }]
    .concat(LOADERS.map((l) => ({ id: l.id, label: l.name + " " + l.entries.length })));
  let filter = "all";
  const fchips = fdefs.map((f) => {
    const c = n("button", "lg-fchip" + (f.id === "all" ? " is-on" : ""));
    c.type = "button";
    c.textContent = f.label;
    c.addEventListener("click", () => { filter = f.id; paint(); });
    filters.append(c);
    return c;
  });
  top.append(filters);
  main.append(top);

  const results = n("div", "lg-results");
  const side = n("aside", "lg-side");
  let selected = 0;

  function items() {
    const q = input.value.trim().toLowerCase();
    let out = [];
    LOADERS.forEach((l) => {
      if (filter === "pin" && !l.pinned) return;
      if (filter !== "all" && filter !== "pin" && l.id !== filter) return;
      l.entries.forEach((e) => {
        if (q && (e.t + " " + l.name + " " + e.p).toLowerCase().indexOf(q) < 0) return;
        out.push({ l: l, e: e });
      });
    });
    return out;
  }

  function paintSide(it) {
    side.replaceChildren();
    if (!it) {
      side.append(n("div", "empty"), n("b", null, "没有匹配项"));
      return;
    }
    const h = n("h4", null, "选中项");
    side.append(h);
    const card = n("div", "lb-block");
    const bh = n("div", "lb-block-head");
    bh.append(ldr(it.l, "sm"), n("b", null, it.e.t));
    card.append(bh);
    const bd = n("div", "lb-block-body");
    bd.style.padding = "6px 10px";
    [["引导器", it.l.name], ["来源", it.e.src], ["路径", it.e.p], ["状态", it.e.def ? "当前默认" : "可用"]].forEach((x) => {
      const f = n("div", "le-fact");
      f.append(n("b", null, x[0]), n("span", null, x[1]));
      bd.append(f);
    });
    card.append(bd);
    side.append(card);
    const acts = n("div", "spec-row");
    acts.append(btn("下次启动", "btn sm primary", "power"), btn("设为默认 ⤴", "btn sm", "elev"));
    side.append(acts);
    side.append(n("div", "spec-note", "回车 = 下次启动；⌘/Ctrl + 回车 = 设为默认（需要提权时会先弹说明）。"));
    side.append(n("h4", null, "同引导器"));
    it.l.entries.filter((e) => e !== it.e).forEach((e) => {
      const b = n("button", "lg-item");
      b.type = "button";
      b.append(n("span", "row-ico " + e.os, OS_TAG[e.os]), n("span", "t"));
      b.lastChild.append(n("b", null, e.t));
      if (e.def) b.append(badge("def", "默认"));
      side.append(b);
    });
  }

  function paint() {
    fchips.forEach((c, i) => c.classList.toggle("is-on", fdefs[i].id === filter));
    const list = items();
    results.replaceChildren();
    let lastLoader = null;
    list.forEach((it, i) => {
      if (it.l !== lastLoader) {
        const g = n("div", "lg-group");
        g.append(ldr(it.l, "sm"), document.createTextNode(it.l.name + " · " + it.l.entries.length + " 项"));
        results.append(g);
        lastLoader = it.l;
      }
      const b = n("button", "lg-item" + (i === selected ? " is-active" : ""));
      b.type = "button";
      b.append(n("span", "row-ico " + it.e.os, OS_TAG[it.e.os]));
      const t = n("span", "t");
      t.append(n("b", null, it.e.t), n("small", null, it.e.p));
      b.append(t);
      if (it.e.def) b.append(badge("def", "默认"));
      if (it.e.last) b.append(badge("last", "上次"));
      b.append(n("span", "kbd", "↵"));
      b.addEventListener("click", () => { selected = i; paint(); });
      results.append(b);
    });
    if (!list.length) {
      const e = n("div", "empty");
      e.append(n("b", null, "没有匹配项"), n("span", null, "试试「windows」「arch」或清掉筛选"));
      results.append(e);
      side.replaceChildren();
      const se = n("div", "empty");
      se.append(n("b", null, "未选中"), n("span", null, "左侧没有可预览的条目"));
      side.append(se);
      return;
    }
    paintSide(list[selected] || null);
  }
  input.addEventListener("input", () => { selected = 0; paint(); });
  main.append(results);

  const foot = n("div", "lg-foot");
  [["↑ ↓", "移动"], ["↵", "下次启动"], ["⌘↵", "设为默认"], ["⌘,", "设置"], ["esc", "清空筛选"]].forEach((x) => {
    const s = n("span");
    s.append(n("span", "kbd", x[0]), document.createTextNode(x[1]));
    foot.append(s);
  });
  main.append(foot);
  wrap.append(main, side);
  paint();
  return wrap;
}

/* ═══════════════════════════════════════════════════════════════════
   13. 方案 J —— 三栏工作台（设置常驻）
   ═══════════════════════════════════════════════════════════════════ */
function viewJ() {
  const wrap = n("div", "lj");
  const c1 = n("aside", "lj-c1");
  c1.append(n("div", "hd", "通道"));
  const nav = n("div", "lj-nav");
  let active = 0;
  const c2 = n("section", "lj-c2");
  const head = n("div", "hd");
  const bd = n("div", "bd");
  c2.append(head, bd);
  const c3 = n("aside", "lj-c3");
  const c3hd = n("div", "hd");
  c3hd.append(icon("gear", "sm"), n("b", null, "引导器设置"), n("span", "grow"));
  const fold = icoBtn("chevron", "收起设置栏（只留图标条）");
  c3hd.append(fold);
  const c3bd = n("div", "bd");
  c3.append(c3hd, c3bd);

  function paint(idx) {
    active = idx;
    const l = LOADERS[idx];
    [...nav.children].forEach((c, i) => c.classList.toggle("is-on", i === idx));
    head.replaceChildren(ldr(l, "sm"), n("b", null, l.name), stateChip(l), n("span", "grow"));
    head.lastChild.style.marginLeft = "auto";
    head.append(btn("下次启动", "btn xs", "power"), icoBtn("more", "更多"));

    bd.replaceChildren();
    const list = n("div", "entries");
    list.style.padding = "0";
    l.entries.forEach((e) => list.append(entryRow(e, l)));
    bd.append(list);
    const note = n("div", "la-foot");
    note.style.marginTop = "10px";
    note.style.borderRadius = "8px";
    note.style.border = "1px solid var(--line)";
    note.append(icon("info", "sm"), n("span", null, l.health));
    bd.append(note);

    c3bd.replaceChildren();
    const groups = [
      ["位置与识别", [["ESP 路径", l.esp, "改"], ["版本", l.ver, "详情"], ["条目数", l.entries.length + " 项", "刷新"]]],
      ["行为", [["默认项", l.entries[0].t, "改"], ["下一启动", l.id === "sdboot" ? "支持一次性" : "需写 BootNext", "说明"], ["权限", l.perm === "nvram" ? "需提权" : "免提权", "提升"]]],
      ["高级", [["内置脚本", l.id === "grub" ? "09_anyboot" : "不适用", "编辑"], ["免密模式", l.id === "oc" ? "未开启" : "不适用", "开启"]]]
    ];
    groups.forEach((g) => {
      const box = n("div", "lj-setgroup");
      box.append(n("div", "gt", g[0]));
      g[1].forEach((s) => {
        const row = n("div", "set");
        const t = n("div", "set-t");
        t.append(n("b", null, s[0]), n("small", null, String(s[1])));
        row.append(t);
        if (s[2] === "开启") row.append(n("span", "switch"));
        else row.append(btn(s[2], "btn xs ghost"));
        box.append(row);
      });
      c3bd.append(box);
    });
    const danger = n("div", "lj-setgroup");
    danger.append(n("div", "gt", "危险区"));
    const d = btn("从固件启动项移除 ⤴", "btn sm danger");
    danger.append(d);
    c3bd.append(danger);
  }

  LOADERS.forEach((l, i) => {
    const b = n("button", "lj-navi" + (i === 0 ? " is-on" : ""));
    b.type = "button";
    b.append(ldr(l, "sm"), n("span", "nm", l.name), dot(l.state));
    b.addEventListener("click", () => paint(i));
    nav.append(b);
  });
  c1.append(nav);
  fold.addEventListener("click", () => c3.classList.toggle("folded"));
  wrap.append(c1, c2, c3);
  paint(0);
  return wrap;
}

/* ═══════════════════════════════════════════════════════════════════
   13.9 方案 K —— 系统引导高级设置（区域编排）
   ═══════════════════════════════════════════════════════════════════ */
/* 编排状态放模块级：切宽度/主题会整页重渲染，用户的编排不该被清掉。
   落地时这里是 localStorage（anyboot.bootRegions）。 */
const K_DEFAULT = {
  visible: { oc: true, refind: true, grub: true, sdboot: false, clover: false },
  region:  { oc: 1, refind: 1, grub: 2, sdboot: 2, clover: 2 },
  axis: "h",              // 两个区域之间：h = 左右，v = 上下
  dir: { 1: "v", 2: "v" } // 区域内部：v = 上下，h = 左右
};
let kState = null;
function kStateLive() {
  if (!kState) kState = JSON.parse(JSON.stringify(K_DEFAULT));
  return kState;
}

/* 区域里的引导器卡：与 A 的卡片同一套原子，只是压掉外边距 */
function kLoaderCard(l) {
  const card = n("div", "k-card");
  const head = n("div", "k-card-head");
  head.append(ldr(l, "sm"), n("span", "nm", l.name), stateChip(l), n("span", "grow"));
  head.append(btn("下次启动", "btn xs"));
  card.append(head);
  const scroll = n("div", "k-entries");
  const list = n("div", "entries");
  list.style.padding = "2px 0 0";
  l.entries.forEach((e) => list.append(entryRow(e, l, { more: false })));
  scroll.append(list);
  card.append(scroll);
  return card;
}

function viewK() {
  const st = kStateLive();
  const wrap = n("div", "k");

  /* ── 设置条：启用哪些引导器 + 两个区域怎么分 ── */
  const bar = n("div", "k-bar");
  const row1 = n("div", "k-row");
  row1.append(n("span", "k-lbl", "启用引导器"));
  const chips = {};
  LOADERS.forEach((l) => {
    const c = n("button", "k-chip");
    c.type = "button";
    c.title = "点击 开/关 展示该引导器";
    c.append(ldr(l, "sm"), n("span", null, l.name));
    const rg = n("button", "k-rg", "区" + st.region[l.id]);
    rg.type = "button";
    rg.title = "点击切到另一个区域";
    rg.addEventListener("click", (e) => {
      e.stopPropagation();
      st.region[l.id] = st.region[l.id] === 1 ? 2 : 1;
      paint();
    });
    c.append(rg);
    c.addEventListener("click", () => { st.visible[l.id] = !st.visible[l.id]; paint(); });
    chips[l.id] = c;
    row1.append(c);
  });
  const reset = btn("重置", "btn xs ghost", "refresh");
  reset.title = "回到默认编排：OC + rEFInd 在区域 1，GRUB 在区域 2";
  reset.addEventListener("click", () => {
    const d = JSON.parse(JSON.stringify(K_DEFAULT));
    st.visible = d.visible; st.region = d.region; st.axis = d.axis; st.dir = d.dir;
    paint();
  });
  row1.append(n("span", "grow"), reset);

  const row2 = n("div", "k-row");
  row2.append(n("span", "k-lbl", "区域分布"));
  const axisSeg = n("div", "seg");
  [["h", "左右"], ["v", "上下"]].forEach(([val, txt]) => {
    const b = n("button", st.axis === val ? "is-on" : "", txt);
    b.type = "button";
    b.addEventListener("click", () => { st.axis = val; paint(); });
    axisSeg.append(b);
  });
  row2.append(axisSeg);
  row2.append(n("span", "hint", "点芯片开/关；点「区1/区2」挪区；区域内部排布在区域标题行选"));

  bar.append(row1, row2);

  /* ── 舞台：两个区域，方向由 st.axis 决定 ── */
  const stage = n("div", "k-stage h");
  const regions = {};
  [1, 2].forEach((idx) => {
    const region = n("section", "k-region");
    const rhd = n("div", "k-rhd");
    const seg = n("div", "seg");
    [["v", "上下"], ["h", "左右"]].forEach(([val, txt]) => {
      const b = n("button", st.dir[idx] === val ? "is-on" : "", txt);
      b.type = "button";
      b.title = "区域 " + idx + " 内部卡片的排布方向";
      b.addEventListener("click", () => { st.dir[idx] = val; paint(); });
      seg.append(b);
    });
    rhd.append(n("b", null, "区域 " + idx), seg, n("span", "grow"));
    const rbody = n("div", "k-rbody v");
    region.append(rhd, rbody);
    regions[idx] = { rhd, rbody };
    stage.append(region);
  });

  function paint() {
    LOADERS.forEach((l) => {
      chips[l.id].classList.toggle("is-on", st.visible[l.id]);
      chips[l.id].classList.toggle("is-off", !st.visible[l.id]);
      chips[l.id].querySelector(".k-rg").textContent = "区" + st.region[l.id];
    });
    stage.classList.toggle("h", st.axis === "h");
    stage.classList.toggle("v", st.axis === "v");
    [1, 2].forEach((idx) => {
      const list = LOADERS.filter((l) => st.visible[l.id] && st.region[l.id] === idx);
      const R = regions[idx];
      R.rhd.querySelectorAll(".seg button").forEach((b, i) => {
        b.classList.toggle("is-on", (i === 0) === (st.dir[idx] === "v"));
      });
      const oldCnt = R.rhd.querySelector(".cnt");
      if (oldCnt) oldCnt.remove();
      R.rhd.append(n("span", "cnt hint", list.length + " 个引导器"));
      R.rbody.classList.toggle("h", st.dir[idx] === "h");
      R.rbody.classList.toggle("v", st.dir[idx] === "v");
      R.rbody.replaceChildren();
      if (!list.length) {
        R.rbody.classList.add("is-empty");
        const hint = n("div", "k-empty-hint");
        hint.append(icon("eye", "lg"), n("span", null, "区域 " + idx + " 没有启用任何引导器"));
        R.rbody.append(hint);
        return;
      }
      R.rbody.classList.remove("is-empty");
      list.forEach((l) => R.rbody.append(kLoaderCard(l)));
    });
  }

  wrap.append(bar, stage);
  paint();
  return wrap;
}

function box(x, y, w, h, title, sub, opt) {
  opt = opt || {};
  const stroke = opt.stroke || "var(--line-2)";
  const fill = opt.fill || "var(--panel)";
  let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${fill}" stroke="${stroke}"/>`;
  out += `<text class="t" x="${x + 12}" y="${y + 21}">${title}</text>`;
  (sub || []).forEach((s, i) => {
    out += `<text class="m" x="${x + 12}" y="${y + 38 + i * 14}">${s}</text>`;
  });
  return out;
}
function arrow(x1, y1, x2, y2, id, label) {
  let out = `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="var(--line-3)" stroke-width="1.4" fill="none" marker-end="url(#ar-${id})"/>`;
  if (label) {
    out += `<text class="m" x="${(x1 + x2) / 2}" y="${y1 - 6}" text-anchor="middle">${label}</text>`;
  }
  return out;
}
function svgWrap(id, w, h, inner) {
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs><marker id="ar-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--line-3)"/></marker></defs>${inner}</svg>`;
}

      const d = n("div", "p");
      d.append(document.createTextNode("＋ "), n("b", null, t));
      box.append(d);
    });
    nt.cons.forEach((t) => {
      const d = n("div", "c");
      d.append(document.createTextNode("－ "), n("b", null, t));
      box.append(d);
    });
    s.append(box);
    const vote = n("p", null, nt.vote);
    vote.style.marginTop = "9px";
    vote.style.color = "var(--dim)";
    vote.style.padding = "7px 9px";
    vote.style.background = "var(--accent-soft)";
    vote.style.borderRadius = "8px";
    s.append(vote);
  }));
}
function notesOverview() {
  notesEl.replaceChildren(notesHead("OVERVIEW", "先定约束，再选排版",
    "十个方案不是十种皮肤：它们对「对象 / 内容 / 设置」的摆放方式完全不同。"));
  notesEl.append(notesSection("问题的真实形态", (s) => {
    s.append(n("p", null, "引导器会继续增加（rEFInd、GRUB、systemd-boot、Clover 之后还有 Windows Boot Manager、UEFI Shell 这类「半个引导器」）。页面长度增长不是主要问题，主要问题是三件事混在一列里：通道状态、条目动作、配置项。"));
  }));
  notesEl.append(notesSection("三条硬约束", (s) => {
    const ul = n("ul", "nlist");
    [
      "<b>可组合</b>：固定、排序、收起必须是三个正交操作，任何视图都要能表达这三个状态。",
      "<b>设置能收</b>：默认只看到「引导器设置」这一行标题；展开是就地，不是跳页。",
      "<b>flex 自适应</b>：只用一个容器查询断点表；滚动永远只发生在内容区。"
    ].forEach((t) => { const li = n("li"); li.innerHTML = t; ul.append(li); });
    s.append(ul);
  }));
  notesEl.append(notesSection("怎么读这十页", (s) => {
    s.append(n("p", null, "每页右侧给：flex 结构树、三档断点行为、编排与设置的具体位置、按钮逐条定义（含出现条件与结果）、弹层清单、以及取舍结论。中间展台可以切 1180 / 900 / 620 / 430 四档宽度看自适应。"));
  }));
  notesEl.append(notesSection("建议的落地顺序", (s) => {
    const ul = n("ul", "nlist");
    [
      "先在现有卡片上加「索引条 + 固定 + 收起」（方案 A），不动数据层。",
      "再把「引导器设置」从卡片里抽成统一折叠条（三级收起的第二级）。",
      "最后按方案 B 重排为左栏 + 右详情，手风琴 H 作为窄窗降级。"
    ].forEach((t) => { const li = n("li"); li.innerHTML = t; ul.append(li); });
    s.append(ul);
  }));
}
function notesSpecs() {
  notesEl.replaceChildren(notesHead("SPECS", "组件先行",
    "排版可以换，原子不能各写一套。"));
  notesEl.append(notesSection("为什么要先定原子", (s) => {
    s.append(n("p", null, "十种排版的差异应该只在「怎么摆」，不应该在「按钮长什么样」。先把按钮三档高度、状态四态、条目行四种形态、折叠条、确认弹窗、提权说明、toast、编排抽屉定死，后面换布局就是拼积木。"));
  }));
  notesEl.append(notesSection("交互硬规则", (s) => {
    const ul = n("ul", "nlist");
    [
      "危险动作默认焦点在「取消」；Esc 取消，点遮罩不关闭。",
      "「下次启动」是主按钮，「设为默认」是次按钮但带 ⤴；两者文案永不混用。",
      "行内动作 hover 才全亮（触屏常亮），避免视觉噪音。",
      "失败必须给下一步动作，不允许只报错。",
      "写操作结果里带 Boot#### 或文件路径，用户能自己核对。"
    ].forEach((t) => { const li = n("li"); li.textContent = t; ul.append(li); });
    s.append(ul);
  }));
}
function notesFlow() {
  notesEl.replaceChildren(notesHead("FLOW", "四张图", "数据流 / 写入往返 / 编排状态机 / 弹层层级。"));
  notesEl.append(notesSection("用它们做验收", (s) => {
    const ul = n("ul", "nlist");
    [
      "任何视图都不能绕过写回回路直接改 UI（无乐观更新）。",
      "提权子进程必须先写后 dump，否则回显要两次。",
      "未检测到的通道自动沉底且不参与排序。",
      "共用弹层挂在 .page 之外，z 只有五档。"
    ].forEach((t) => { const li = n("li"); li.textContent = t; ul.append(li); });
    s.append(ul);
  }));
}

/* ═══════════════════════════════════════════════════════════════════
   20. 启动与事件
   ═══════════════════════════════════════════════════════════════════ */
const railList = document.getElementById("railList");
const view = document.getElementById("view");
const notesEl = document.getElementById("notes");
const stage = document.getElementById("stage");
const win = document.querySelector(".win");
const winTag = document.getElementById("winTag");
const stageKicker = document.getElementById("stageKicker");
const stageTitle = document.getElementById("stageTitle");
const stageSub = document.getElementById("stageSub");

const state = { tab: "layouts", idx: -1, width: 1180, notes: window.innerWidth >= 1520 };

/* 模拟窗口的容器断点：ResizeObserver 往 .win-body 挂 .vw-* 类。
   之前用的 @container 在没有 container queries 的内核上会整体失效 ——
   窗口一窄侧栏/主区还按宽屏排，挤成一团。类断点在任何内核都成立，
   CSS 里所有断点规则都已改成 .win-body.vw-900 / .vw-760 / .vw-520 前缀。 */
const vwRO = new ResizeObserver((entries) => {
  const w = entries[0].contentRect.width;
  view.classList.toggle("vw-g", w >= 900);
  view.classList.toggle("vw-900", w <= 900);
  view.classList.toggle("vw-760", w <= 760);
  view.classList.toggle("vw-520", w <= 520);
});
vwRO.observe(view);

function renderRail() {
  railList.replaceChildren();
  const ov = n("button", "rail-item" + (state.tab === "layouts" && state.idx < 0 ? " is-on" : ""));
  ov.type = "button";
  const ovt = n("span", "rt-wrap");
  ovt.append(n("span", "rt", "总览"), n("span", "rs", "约束 · 对比 · 推荐组合"));
  ov.append(n("span", "rail-idx", "◎"), ovt);
  ov.addEventListener("click", () => { state.tab = "layouts"; state.idx = -1; render(); });
  railList.append(ov);

  LAYOUTS.forEach((L, i) => {
    const b = n("button", "rail-item" + (state.tab === "layouts" && state.idx === i ? " is-on" : ""));
    b.type = "button";
    b.append(n("span", "rail-idx", L.key));
    const t = n("span", "rt", L.name);
    const s = n("span", "rs", L.tag);
    const wrap = n("span", "rt-wrap");
    wrap.append(t, s);
    b.append(wrap);
    b.addEventListener("click", () => { state.tab = "layouts"; state.idx = i; render(); });
    railList.append(b);
  });
}

function render() {
  document.querySelectorAll(".rail-tab").forEach((t) => {
    t.classList.toggle("is-on", t.dataset.rail === state.tab);
  });
  win.style.setProperty("--w", state.width + "px");
  winTag.textContent = "宽 " + state.width;

  if (state.tab === "specs") {
    stageKicker.textContent = "SPECS";
    stageTitle.textContent = "组件规格";
    stageSub.textContent = "按钮 / 状态 / 条目行 / 折叠条 / 弹窗 / toast / 编排抽屉";
    view.replaceChildren(specsView());
    notesSpecs();
  } else if (state.tab === "flow") {
    stageKicker.textContent = "FLOW";
    stageTitle.textContent = "操作逻辑图";
    stageSub.textContent = "数据流 · 写入往返 · 编排状态机 · 弹层层级";
    view.replaceChildren(diagramsView());
    notesFlow();
  } else if (state.idx < 0) {
    stageKicker.textContent = "OVERVIEW";
    stageTitle.textContent = "总览与取舍";
    stageSub.textContent = "同一份快照，十种信息架构。";
    view.replaceChildren(overviewView());
    notesOverview();
  } else {
    const L = LAYOUTS[state.idx];
    stageKicker.textContent = "LAYOUT " + L.key;
    stageTitle.textContent = L.name;
    stageSub.textContent = L.sub;
    view.replaceChildren(L.fn());
    notesFor(L);
  }
  const docPage = state.tab === "specs" || state.tab === "flow";
  view.style.height = docPage ? "auto" : "";
  view.style.maxHeight = docPage ? "none" : "";
  notesEl.classList.toggle("is-off", !state.notes);
  document.getElementById("toggleNotes").textContent = state.notes ? "隐藏说明" : "显示说明";
  view.scrollTop = 0;
  stage.scrollTop = 0;
}

document.querySelectorAll(".rail-tab").forEach((t) => {
  t.addEventListener("click", () => { state.tab = t.dataset.rail; render(); });
});
document.querySelectorAll("#widthBtns .btn").forEach((b) => {
  b.addEventListener("click", () => {
    state.width = Number(b.dataset.w);
    document.querySelectorAll("#widthBtns .btn").forEach((x) => x.classList.toggle("primary", x === b));
    render();
  });
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  root.setAttribute("data-theme", root.getAttribute("data-theme") === "light" ? "dark" : "light");
});
document.getElementById("toggleNotes").addEventListener("click", (e) => {
  state.notes = !state.notes;
  e.currentTarget.textContent = state.notes ? "隐藏说明" : "显示说明";
  render();
});

/* ── 侧栏隐藏开关（默认藏起，记忆到 localStorage；左下角 FAB / 快捷键 [ 唤回）── */
const shell = document.querySelector(".shell");
function applyRail() {
  const off = localStorage.getItem("bml_railOff") !== "0"; // 默认隐藏
  shell.classList.toggle("rail-off", off);
  document.getElementById("toggleRail").textContent = off ? "显示侧栏" : "隐藏侧栏";
}
document.getElementById("toggleRail").addEventListener("click", () => {
  localStorage.setItem("bml_railOff", localStorage.getItem("bml_railOff") === "1" ? "0" : "1");
  applyRail();
});
document.getElementById("railFab").addEventListener("click", () => {
  localStorage.setItem("bml_railOff", "0");
  applyRail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "[" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "")) {
    localStorage.setItem("bml_railOff", localStorage.getItem("bml_railOff") === "1" ? "0" : "1");
    applyRail();
  }
});
applyRail();

const ovl = document.getElementById("ovl");
function openFlow() {
  const body = document.getElementById("ovlBody");
  if (!body.childElementCount) {
    DIAGRAMS.forEach((d) => {
      const boxEl = n("div", "diag");
      const h = n("h4");
      h.append(document.createTextNode(d.title), n("em", null, d.note));
      const holder = n("div");
      holder.innerHTML = d.svg;
      boxEl.append(h, holder.firstChild);
      body.append(boxEl);
    });
  }
  ovl.classList.add("is-on");
}
document.getElementById("openFlow").addEventListener("click", openFlow);
document.getElementById("ovlClose").addEventListener("click", () => ovl.classList.remove("is-on"));
ovl.addEventListener("click", (e) => { if (e.target === ovl) ovl.classList.remove("is-on"); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") ovl.classList.remove("is-on");
});

/* 支持用 #B / #specs / #flow 直接打开某一页（截图与分享用） */
(function fromHash() {
  const q = new URLSearchParams(location.search || "");
  const w = Number(q.get("w"));
  if ([1180, 900, 620, 430].indexOf(w) >= 0) state.width = w;
  const h = (location.hash || "").replace("#", "").toLowerCase();
  if (!h) return;
  if (h === "specs") state.tab = "specs";
  else if (h === "flow") state.tab = "flow";
  else {
    const i = LAYOUTS.findIndex((x) => x.key.toLowerCase() === h);
    if (i >= 0) { state.tab = "layouts"; state.idx = i; }
  }
})();

renderRail();
render();
document.querySelectorAll("#widthBtns .btn").forEach((b) => {
  b.classList.toggle("primary", Number(b.dataset.w) === state.width);
});

})();
</script>
</body>
</html>
