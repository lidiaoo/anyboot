<style>
  /* ---- 主题 token：与设计稿同一套色板 ---- */
  html.dark{

    --fg-dim:148 163 184; --fg-faint:100 116 139;
    --ok:34 197 94; --warn:245 158 11; --bad:239 68 68; --accent:99 102 241;
    --tblue:96 165 250;
    color-scheme:dark;
  }
  html.light{
    --base:244 246 250; --term:4 7 15; --card:255 255 255; --elevate:241 245 250;
    --line:226 232 240; --linestrong:203 213 225;
    --fg:15 23 42; --fgdim:90 100 118; --fgfaint:138 148 166;
    --fg-dim:90 100 118; --fg-faint:138 148 166;
    --ok:22 163 74; --warn:180 83 9; --bad:220 38 38; --accent:79 70 229;
    --tblue:37 99 235;
    color-scheme:light;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: rgb(var(--base));
    color: rgb(var(--fg));
    font: 14px/1.5 -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display:none !important; }
  .scroll-thin::-webkit-scrollbar { width:8px; height:8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgb(var(--linestrong)); border-radius:4px; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
  .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }

  /* ============ 标题栏 ============ */
  header {

    border-bottom:1px solid rgb(var(--line)); background:rgb(var(--card) / .6);
    user-select:none; flex:none;
  }
  header .appicon {
    display:grid; place-items:center; width:24px; height:24px; border-radius:6px; flex:none;
    background:rgb(var(--tblue) / .15); color:rgb(var(--tblue));
  }
  header h1 { margin:0; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .pill {
    display:inline-flex; align-items:center; gap:6px; border-radius:9999px;
    padding:2px 9px; font-size:11px; font-weight:500; flex:none;
  }
  .pill.ok { background:rgb(var(--ok) / .1); color:rgb(var(--ok)); }
  .pill.bad { background:rgb(var(--bad) / .1); color:rgb(var(--bad)); }
  .pill .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  header .tools { margin-left:auto; display:flex; align-items:center; gap:2px; color:rgb(var(--fgfaint)); flex:none; }
  .toolbtn {
    display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px;

    transition: background .15s, color .15s;
  }
  .toolbtn:hover { background:rgb(var(--elevate)); color:rgb(var(--fg)); }

  /* ============ 路径栏 + 操作 ============ */
  .pathbar {
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; flex:none;
    border-bottom:1px solid rgb(var(--line)); background:rgb(var(--card) / .3);
    padding:9px 14px;
  }
  .iconbtn {
    display:grid; place-items:center; width:32px; height:32px; flex:none;
    border:1px solid rgb(var(--line)); border-radius:9px; background:rgb(var(--elevate));
    color:rgb(var(--fgdim)); cursor:pointer; transition: border-color .15s, color .15s;
  }
  .iconbtn:hover { border-color:rgb(var(--linestrong)); color:rgb(var(--fg)); }
  .crumbs {
    display:flex; align-items:center; gap:2px; min-width:0; flex:1; overflow-x:auto;
    border:1px solid rgb(var(--line)); border-radius:9px; background:rgb(var(--term));
    padding:6px 10px; font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace; font-size:12px;
  }
  .crumbs::-webkit-scrollbar { height:0; }
  .crumb { border:0; background:transparent; padding:1px 5px; border-radius:4px; color:rgb(var(--tblue)); cursor:pointer; white-space:nowrap; }
  .crumb:hover { background:rgb(var(--elevate)); }
  .crumb[aria-current="true"] { color:rgb(var(--fg)); cursor:default; }
  .crumb-sep { color:rgb(var(--fg-faint)); }
  .btn {
    display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px;
    border:1px solid rgb(var(--line)); border-radius:9px; background:rgb(var(--elevate));
    font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color:rgb(var(--linestrong)); }
  .btn.primary { border:0; background:rgb(var(--accent)); color:#fff; font-weight:600; }
  .btn.primary:hover { background:rgb(var(--accent) / .85); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  /* ============ 文件表 ============ */
  .table-wrap { flex:1; min-height:0; overflow:auto; }
  table { width:100%; min-width:640px; border-collapse:collapse; text-align:left; font-size:13px; }
  thead { position:sticky; top:0; z-index:10; background:rgb(var(--card) / .95); backdrop-filter: blur(4px); }
  thead tr { border-bottom:1px solid rgb(var(--line)); }
  th {
    padding:9px 12px; font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.08em; color:rgb(var(--fg-faint));
  }
  tbody { font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace; font-size:13px; }
  tbody tr { border-bottom:1px solid rgb(var(--line) / .6); cursor:default; }
  tbody tr:hover { background:rgb(var(--elevate) / .6); }
  tbody tr.selected { background:rgb(var(--tblue) / .07); }
  td { padding:9px 12px; }
  td .namecell { display:flex; align-items:center; gap:10px; }
  td .namecell svg { width:16px; height:16px; flex:none; }
  td .namecell.dir svg { color:rgb(var(--tblue)); }
  td .namecell.link svg { color:rgb(var(--warn)); }
  td .namecell.file svg { color:rgb(var(--fgdim)); }
  td .namecell span { font-family:-apple-system,"Segoe UI","Noto Sans SC",sans-serif; }
  .dim { color:rgb(var(--fg-dim)); } .faint { color:rgb(var(--fg-faint)); }
  .rowdl {
    border:0; background:transparent; border-radius:6px; padding:4px; cursor:pointer;
    color:rgb(var(--fg-faint)); display:inline-grid; place-items:center;
  }
  .rowdl svg { width:14px; height:14px; }
  .rowdl:hover { color:rgb(var(--fg)); }

  /* 行内 ⋯ 菜单 / 路径快跳菜单（设计稿 files 屏） */
  .popmenu {
    position:fixed; z-index:60; min-width:132px; padding:4px;
    background:rgb(var(--card)); border:1px solid rgb(var(--linestrong)); border-radius:9px;
    box-shadow:0 16px 40px -8px rgba(0,0,0,.65);
  }
  .popmenu button {
    display:flex; width:100%; align-items:center; gap:8px; border:0; background:transparent;
    border-radius:6px; padding:7px 10px; font-size:12.5px; cursor:pointer; color:rgb(var(--fg)); text-align:left;
  }
  .popmenu button:hover { background:rgb(var(--elevate)); }
  .popmenu button.danger { color:rgb(var(--bad)); }
  .popmenu button.cur { color:rgb(var(--fgfaint)); cursor:default; }
  .popmenu button.cur:hover { background:transparent; }
  .popmenu .mono { font-size:12px; }

  /* 行尾 ⋯ 文件操作面板（设计稿 pc-redesign-v2 files-menu 屏一比一） */
  .filemenu {
    position:fixed; z-index:60; width:272px; padding:10px;
    background:rgb(var(--card)); border:1px solid rgb(var(--linestrong)); border-radius:14px;
    box-shadow:0 16px 40px -8px rgba(0,0,0,.65);
  }
  .fm-preview {
    display:flex; align-items:center; gap:10px; padding:9px;
    border:1px solid rgb(var(--line)); border-radius:10px; background:rgb(var(--base));
  }
  .fm-icon {
    display:grid; place-items:center; width:34px; height:34px; flex:none; border-radius:8px;
    background:rgb(var(--tblue) / .12); color:rgb(var(--tblue));
  }
  .fm-icon svg { width:16px; height:16px; }
  .fm-names { min-width:0; flex:1; display:flex; flex-direction:column; gap:1px; }
  .fm-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fm-meta { font-size:11px; color:rgb(var(--fgdim)); }
  .fm-close {
    display:grid; place-items:center; width:26px; height:26px; flex:none; border:0; border-radius:9999px;
    background:transparent; color:rgb(var(--fgdim)); cursor:pointer;
  }
  .fm-close:hover { background:rgb(var(--elevate)); color:rgb(var(--fg)); }
  .fm-group { display:flex; flex-direction:column; gap:2px; margin-top:8px; }
  .fm-label { margin:8px 0 0; padding:0 12px; font-size:11px; color:rgb(var(--fgfaint)); }
  .fm-act {
    display:flex; width:100%; align-items:center; gap:10px; height:34px; padding:0 12px;
    border:0; background:transparent; border-radius:8px; font-size:12.5px; cursor:pointer;
    color:rgb(var(--fg)); text-align:left;
  }
  .fm-act svg { width:15px; height:15px; flex:none; color:rgb(var(--fgdim)); }
  .fm-act:hover { background:rgb(var(--elevate)); }
  .fm-act.accent { color:rgb(var(--accent)); font-weight:500; }
  .fm-act.accent svg { color:rgb(var(--accent)); }
  .fm-act.danger { color:rgb(var(--bad)); font-weight:500; }
  .fm-act.danger svg { color:rgb(var(--bad)); }
  .fm-act.danger:hover { background:rgb(var(--bad) / .1); }

  /* 详情键值行 */
  .kv { display:flex; justify-content:space-between; gap:14px; font-size:13px; }
  .kv > span:first-child { flex:none; color:rgb(var(--fg-faint)); }
  .kv > span:last-child { text-align:right; word-break:break-all; font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace; }
  .modal-body .hint { font-size:11px; color:rgb(var(--fg-faint)); }

  .btn.dangerbtn { border:0; background:rgb(var(--bad)); color:#fff; font-weight:600; }
  .btn.dangerbtn:hover { background:rgb(var(--bad) / .85); }
  .modal-body p { margin:0; font-size:13px; line-height:1.6; color:rgb(var(--fgdim)); word-break:break-all; }

  /* 传输徽标 + 速度/剩余（设计稿：64% · 18.2 MB/s · 剩余 12s） */
  .tbadge {

  .tmeta { color:rgb(var(--fgfaint)); white-space:nowrap; }
  .empty-tip { padding:44px 0; text-align:center; color:rgb(var(--fg-faint)); font-size:13px; }

  /* ============ 传输队列 + 状态栏 ============ */
  .transfer {
    display:flex; align-items:center; gap:12px; flex:none;

  .transfer[hidden] { display:none; }
  .spin { width:14px; height:14px; flex:none; color:rgb(var(--accent)); animation:ab-spin 1s linear infinite; }
  @keyframes ab-spin { to { transform: rotate(360deg); } }
  .bar { height:6px; min-width:120px; flex:1; border-radius:9999px; background:rgb(var(--elevate)); overflow:hidden; }
  .bar > div { height:100%; border-radius:9999px; background:linear-gradient(90deg, rgb(var(--accent)), rgb(var(--tblue))); transition: width .25s; }

  @keyframes ab-slide { 0% { margin-left:-40%; } 100% { margin-left:100%; } }
  .pct { font-size:12px; color:rgb(var(--accent)); min-width:38px; text-align:right; }
  .pct.fail { color:rgb(var(--bad)); }
  footer {
    display:flex; align-items:center; gap:14px; flex:none;
    border-top:1px solid rgb(var(--line)); background:rgb(var(--card) / .6);
    padding:7px 20px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:rgb(var(--fgfaint));
  }
  footer .clock { margin-left:auto; }

  /* 弹层 & Toast */
  .modal { position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(0,0,0,.6); padding:24px; }
  .modal-card { width:100%; max-width:380px; background:rgb(var(--card)); border:1px solid rgb(var(--linestrong)); border-radius:14px; box-shadow:0 16px 48px -8px rgba(0,0,0,.65); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid rgb(var(--line)); }
  .modal-head h3 { margin:0; font-size:15px; font-weight:600; }
  .modal-body { padding:18px 22px; display:flex; flex-direction:column; gap:8px; }
  .modal-body label { font-size:12px; font-weight:500; color:rgb(var(--fgdim)); }
  .modal-body input {
    height:36px; width:100%; border:1px solid rgb(var(--line)); border-radius:9px;
    background:rgb(var(--elevate)); padding:0 12px; color:rgb(var(--fg)); font-size:13px; outline:none;
  }
  .modal-body input:focus { border-color:rgb(var(--accent) / .6); }
  .modal-foot { display:flex; justify-content:flex-end; gap:8px; border-top:1px solid rgb(var(--line)); padding:14px 22px; }
  .btn.plain { border:0; background:transparent; color:rgb(var(--fgdim)); }
  .btn.plain:hover { color:rgb(var(--fg)); }
  #toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:50;
    background:rgb(var(--elevate)); border:1px solid rgb(var(--linestrong)); border-radius:9px;
    padding:10px 16px; font-size:13px; box-shadow:0 16px 40px -8px rgba(0,0,0,.65); transition:opacity .2s;
    max-width:80vw; word-break:break-all;
  }
</style>

<script>
const HAS_TAURI = typeof window.__TAURI__ !== "undefined";
const invoke = HAS_TAURI ? window.__TAURI__.core.invoke : null;
const listen = HAS_TAURI ? window.__TAURI__.event.listen : null;

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false; t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.hidden = true, 200); }, 2600);
}

/* ---------- 主题 ---------- */
function applyTheme(t) {
  document.documentElement.classList.remove('light', 'dark');
  document.documentElement.classList.add(t);
  try { localStorage.setItem('ab-theme', t); } catch (e) {}
}
document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.classList.contains('light') ? 'dark' : 'light');
});
try { applyTheme(localStorage.getItem('ab-theme') || 'dark'); } catch (e) { applyTheme('dark'); }

/* ---------- 状态 ---------- */
let server = null;          // HubServer json
let cwd = '/';              // 当前远端目录
let entries = [];           // SftpEntry[]
let selected = null;        // 选中的文件（仅文件可下载）
let busy = false;           // 列表/传输进行中

const $ = (id) => document.getElementById(id);
const DIR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
const FILE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const LINK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>';
const MORE_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';

function humanSize(n) {
  if (n < 1024) return n + 'B';
  const units = ['K', 'M', 'G', 'T'];
  let v = n;
  for (const u of units) {
    v /= 1024;
    if (v < 1024) return (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + u;
  }
  return v.toFixed(1) + 'P';
}

function joinPath(dir, name) {
  return dir.endsWith('/') ? dir + name : dir + '/' + name;
}

/* ---------- 面包屑 ---------- */
function renderCrumbs() {
  const nav = $('crumbs');
  nav.textContent = '';
  const parts = cwd.split('/').filter((p) => p !== '');
  const addCrumb = (label, target, isCurrent) => {
    if (!isCurrent) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep'; sep.textContent = '›'; sep.setAttribute('aria-hidden', 'true');
      nav.appendChild(sep);
    }
    const b = document.createElement('button');
    b.className = 'crumb';
    b.textContent = label;
    b.setAttribute('aria-current', String(isCurrent));
    if (!isCurrent) b.addEventListener('click', () => gotoDir(target));
    nav.appendChild(b);
  };
  addCrumb('/', '/', parts.length === 0);
  let acc = '';
  parts.forEach((part, i) => {
    acc += '/' + part;
    addCrumb(part, acc, i === parts.length - 1);
  });
  nav.scrollLeft = nav.scrollWidth;
}

/* ---------- 列表 ---------- */
function renderTable() {
  const tbody = $('tbody');
  tbody.textContent = '';
  let totalSize = 0;
  for (const entry of entries) {
    totalSize += entry.size || 0;
    const tr = document.createElement('tr');
    tr.dataset.name = entry.name;
    const kind = entry.dir ? 'dir' : (entry.link ? 'link' : 'file');
    tr.innerHTML =
      '<td><span class="namecell ' + kind + '">' +
      (kind === 'dir' ? DIR_SVG : kind === 'link' ? LINK_SVG : FILE_SVG) +
      '<span></span></span></td>' +
      '<td class="' + (entry.dir ? 'faint' : '') + '">' + (entry.dir ? '—' : humanSize(entry.size)) + '</td>' +
      '<td class="dim">' + (entry.perms || '—') + '</td>' +
      '<td class="dim">' + (entry.mtime || '—') + '</td>' +
      '<td style="text-align:right"></td>';
    tr.querySelector('.namecell span').textContent = entry.name;
    const opTd = tr.lastElementChild;
    const op = document.createElement('button');
    op.className = 'rowdl'; op.title = '操作'; op.setAttribute('aria-label', entry.name + ' 操作');
    op.innerHTML = MORE_SVG;
    op.addEventListener('click', (e) => { e.stopPropagation(); openRowMenu(op, entry); });
    opTd.appendChild(op);
    tr.addEventListener('click', () => selectEntry(tr, entry));
    tr.addEventListener('dblclick', () => { if (entry.dir) gotoDir(joinPath(cwd, entry.name)); });
    tbody.appendChild(tr);
  }
  $('footCount').textContent = entries.length
    ? `${entries.length} 项 · ${humanSize(totalSize)}`
    : '0 项';
  const tip = $('emptyTip');
  if (!entries.length) {
    tip.hidden = false;
    tip.textContent = busy ? '读取中…' : '（空目录）';
  } else {
    tip.hidden = true;
  }
}

function selectEntry(tr, entry) {
  if (entry.dir) return;
  selected = entry;
  document.querySelectorAll('#tbody tr.selected').forEach((row) => row.classList.remove('selected'));
  tr.classList.add('selected');
  $('downloadBtn').disabled = false;
  $('downloadBtn').title = '下载 ' + entry.name;
}

async function gotoDir(path, force) {
  if (!invoke || !server) return;
  if (busy && !force) return;
  busy = true;
  selected = null;
  $('downloadBtn').disabled = true;
  try {
    const list = await invoke('hub_sftp_list', { server, path });
    cwd = path;
    entries = list || [];
    renderCrumbs();
    renderTable();
  } catch (e) {
    toast('读取失败：' + e);
  } finally {
    busy = false;
  }
}

async function refresh() {
  await gotoDir(cwd, true);
}

/* ---------- 传输 ---------- */
let prog = { key: '', lastBytes: 0, lastT: 0, speed: 0 };
function showTransfer(dir, name, indeterminate) {
  const badge = $('transferDir');
  badge.hidden = !dir;
  badge.textContent = dir === 'up' ? '↑ 上传' : '↓ 下载';
  badge.className = 'tbadge ' + (dir === 'up' ? 'up' : 'down');
  const key = dir + '|' + name;
  if (prog.key !== key) prog = { key, lastBytes: 0, lastT: 0, speed: 0 };
  $('transfer').hidden = false;
  $('transferName').textContent = name;
  const bar = $('transferBar');
  bar.classList.toggle('indet', !!indeterminate);
  $('transferFill').style.width = indeterminate ? '40%' : '0%';
  $('transferPct').textContent = '0%';
  $('transferPct').classList.remove('fail');
  $('transferMeta').textContent = '';
}
function progTick(bytes, total) {
  const now = performance.now();
  if (prog.lastT) {
    const dt = (now - prog.lastT) / 1000;
    if (dt > 0.25) {
      prog.speed = Math.max(0, (bytes - prog.lastBytes) / dt);
      prog.lastBytes = bytes;
      prog.lastT = now;
    }
  } else {
    prog.lastBytes = bytes;
    prog.lastT = now;
  }
  let meta = '';
  if (prog.speed > 0) {
    meta = humanSize(prog.speed) + '/s';
    if (total > 0 && prog.speed > 0) {
      const remain = Math.max(0, (total - bytes) / prog.speed);
      meta += remain < 60
        ? ' · 剩余 ' + Math.ceil(remain) + 's'
        : ' · 剩余 ' + Math.floor(remain / 60) + 'm' + String(Math.floor(remain % 60)).padStart(2, '0') + 's';
    }
  }
  $('transferMeta').textContent = meta;
}
function updateTransfer(bytes, total) {
  const pct = total > 0 ? Math.min(100, Math.round((bytes / total) * 100)) : 0;
  $('transferFill').style.width = pct + '%';
  $('transferPct').textContent = pct + '%';
  progTick(bytes, total);
}
function hideTransfer() { $('transfer').hidden = true; }

async function downloadEntry(entry) {
  if (!invoke || !server || busy) return;
  busy = true;
  showTransfer('down', '下载 ' + entry.name, false);
  try {
    // 下载路径取终端设置的「下载路径」（默认 ~，由后端展开主目录）
    let downDir = '~';
    try {
      const s = JSON.parse(localStorage.getItem('ab-term-settings') || '{}');
      if (typeof s.downDir === 'string' && s.downDir.trim()) downDir = s.downDir.trim();
    } catch (e) {}
    const local = await invoke('hub_sftp_download', {
      server,
      remotePath: joinPath(cwd, entry.name),
      total: entry.size || 0,
      filename: entry.name,
      localDir: downDir,
    });
    toast('已下载到 ' + local);
  } catch (e) {
    hideTransfer();
    toast('下载失败：' + e);
  } finally {
    busy = false;
    setTimeout(hideTransfer, 600);
  }
}

async function upload() {
  if (!invoke || !server || busy) return;
  busy = true;
  try {
    const uploaded = await invoke('hub_sftp_upload', { server, remoteDir: cwd });
    if (uploaded?.length) toast('已上传 ' + uploaded.length + ' 个文件');
  } catch (e) {
    const msg = String(e);
    if (msg !== '未选择文件') toast('上传失败：' + msg);
  } finally {
    busy = false;
    hideTransfer();
    await refresh();
  }
}

/* ---------- 新建目录 ---------- */
function openMkdir() {
  $('mkdirName').value = '';
  $('mkdirModal').hidden = false;
  $('mkdirName').focus();
}
function closeMkdir() { $('mkdirModal').hidden = true; }
async function submitMkdir() {
  const name = $('mkdirName').value.trim();
  if (!name) return;
  try {
    await invoke('hub_sftp_mkdir', { server, path: joinPath(cwd, name) });
    closeMkdir();
    toast('已创建 ' + name);
    await refresh();
  } catch (e) {
    toast('创建失败：' + e);
  }
}
$('mkdirBtn').addEventListener('click', openMkdir);
$('mkdirClose').addEventListener('click', closeMkdir);
$('mkdirCancel').addEventListener('click', closeMkdir);
$('mkdirOk').addEventListener('click', submitMkdir);
$('mkdirForm').addEventListener('submit', (e) => { e.preventDefault(); submitMkdir(); });
$('mkdirModal').addEventListener('click', (e) => { if (e.target.id === 'mkdirModal') closeMkdir(); });

/* ---------- 行尾 ⋯ 文件操作面板（设计稿 files-menu 屏） ---------- */
let menuTarget = null;                       // 面板当前指向的条目
let clip = null;                             // 复制/剪切标记 { entry, dir, mode: 'copy'|'cut' }
let destState = null;                        // 复制到/移动到待执行 { mode, src, fromDir }

function kindOf(entry) { return entry.dir ? 'dir' : (entry.link ? 'link' : 'file'); }

function openRowMenu(btn, entry) {
  menuTarget = entry;
  // 对象预览：图标/配色随类型（与文件表同款），meta = 大小 · 修改时间
  const kind = kindOf(entry);
  $('fmIcoFile').hidden = kind !== 'file';
  $('fmIcoDir').hidden = kind !== 'dir';
  $('fmIcoLink').hidden = kind !== 'link';
  const icon = $('fmIcon');
  const color = kind === 'dir' ? 'var(--tblue)' : kind === 'link' ? 'var(--warn)' : 'var(--fgdim)';
  icon.style.color = `rgb(${color})`;
  icon.style.background = `rgb(${color} / .12)`;
  $('fmName').textContent = entry.name;
  $('fmMeta').textContent = (entry.dir ? '—' : humanSize(entry.size)) + ' · ' + (entry.mtime || '—');
  $('rmDownload').hidden = !!entry.dir;   // 目录无下载（对齐手机：动作对齐 SFTP 实际能力）
  $('rmDownload').disabled = busy;
  const m = $('rowMenu');
  m.hidden = false;
  const r = btn.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let x = Math.min(r.right - mw, window.innerWidth - mw - 8);
  let y = r.bottom + 4;
  if (y + mh > window.innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  m.style.left = Math.max(8, x) + 'px';
  m.style.top = y + 'px';
}
function closeRowMenu() { $('rowMenu').hidden = true; }

async function writeClipboard(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
}

/* 主动作 */
$('rmDownload').addEventListener('click', () => { const e = menuTarget; closeRowMenu(); if (e && !e.dir) downloadEntry(e); });
$('rmRename').addEventListener('click', () => { const e = menuTarget; closeRowMenu(); if (e) openRename(e); });
$('rmCopyPath').addEventListener('click', () => { const e = menuTarget; closeRowMenu(); if (!e) return; writeClipboard(joinPath(cwd, e.name.split(' -> ')[0])); toast('已复制路径'); });
$('rmDelete').addEventListener('click', () => { const e = menuTarget; closeRowMenu(); if (e) openDelete(e); });
$('fmClose').addEventListener('click', closeRowMenu);

/* 详情：全部来自列表元数据，不再打后端 */
$('rmInfo').addEventListener('click', () => {
  const e = menuTarget; closeRowMenu(); if (!e) return;
  const rows = [
    ['名称', e.name.split(' -> ')[0]],
    ['类型', e.dir ? '目录' : e.link ? '软链接' : '文件'],
    ['大小', e.dir ? '—' : humanSize(e.size) + '（' + e.size + ' B）'],
    ['权限', e.perms || '—'],
    ['修改时间', e.mtime || '—'],
    ['路径', joinPath(cwd, e.name)],
  ];
  if (e.link && e.target) rows.splice(2, 0, ['指向', e.target]);
  const box = $('infoRows');
  box.textContent = '';
  for (const [k, v] of rows) {
    const line = document.createElement('div');
    line.className = 'kv';
    const a = document.createElement('span'); a.textContent = k;
    const b = document.createElement('span'); b.textContent = v;
    line.append(a, b);
    box.appendChild(line);
  }
  $('infoModal').hidden = false;
});
function closeInfo() { $('infoModal').hidden = true; }
$('infoClose').addEventListener('click', closeInfo);
$('infoOk').addEventListener('click', closeInfo);
$('infoModal').addEventListener('click', (e) => { if (e.target.id === 'infoModal') closeInfo(); });

/* 复制 / 剪切：只做标记（与手机一致），由「复制到 / 移动到」落到目标路径 */
$('rmCopy').addEventListener('click', () => {
  const e = menuTarget; closeRowMenu(); if (!e) return;
  clip = { entry: e, dir: cwd, mode: 'copy' };
  toast('已复制 ' + e.name + ' —— 到目标位置用「复制到...」落下');
});
$('rmCut').addEventListener('click', () => {
  const e = menuTarget; closeRowMenu(); if (!e) return;
  clip = { entry: e, dir: cwd, mode: 'cut' };
  toast('已剪切 ' + e.name + ' —— 到目标位置用「移动到...」落下');
});

/* 复制到 / 移动到：优先消费复制/剪切标记，否则对当前面板条目 */
$('rmCopyTo').addEventListener('click', () => { closeRowMenu(); openDest('copy'); });
$('rmMoveTo').addEventListener('click', () => { closeRowMenu(); openDest('move'); });

function openDest(mode) {
  let src, fromDir;
  const wantClip = mode === 'copy' ? 'copy' : 'cut';   // clip 标记是 copy/cut，动作是 copy/move
  if (clip && clip.mode === wantClip) { src = clip.entry; fromDir = clip.dir; }
  else if (menuTarget) { src = menuTarget; fromDir = cwd; }
  else { toast('先在文件上选「' + (mode === 'copy' ? '复制' : '剪切') + '」'); return; }
  destState = { mode, src, fromDir };
  $('destTitle').textContent = mode === 'copy' ? '复制到' : '移动到';
  $('destLabel').textContent = (mode === 'copy' ? '复制 ' : '移动 ') + src.name.split(' -> ')[0] + ' 到（目标路径，含文件名）';
  $('destPath').value = joinPath(cwd, src.name.split(' -> ')[0]);
  $('destModal').hidden = false;
  $('destPath').focus();
  $('destPath').select();
}
function closeDest() { $('destModal').hidden = true; destState = null; }
async function submitDest() {
  const st = destState;
  closeDest();
  if (!st) return;
  const to = $('destPath').value.trim();
  const from = joinPath(st.fromDir, st.src.name.split(' -> ')[0]);
  if (!to || to === from) return;
  try {
    if (st.mode === 'copy') {
      await invoke('hub_sftp_copy', { server, from, to });
      toast('已复制到 ' + to);
    } else {
      await invoke('hub_sftp_rename', { server, from, to });
      if (clip && clip.mode === 'cut' && clip.entry.name === st.src.name) clip = null;
      if (selected && selected.name === st.src.name) { selected = null; $('downloadBtn').disabled = true; }
      toast('已移动到 ' + to);
    }
    await refresh();
  } catch (e) {
    toast((st.mode === 'copy' ? '复制失败：' : '移动失败：') + e);
  }
}
$('destClose').addEventListener('click', closeDest);
$('destCancel').addEventListener('click', closeDest);
$('destOk').addEventListener('click', submitDest);
$('destForm').addEventListener('submit', (e) => { e.preventDefault(); submitDest(); });
$('destModal').addEventListener('click', (e) => { if (e.target.id === 'destModal') closeDest(); });

/* ---------- 重命名 ---------- */
let renameTarget = null;
function openRename(entry) {
  renameTarget = entry;
  $('renameName').value = entry.name;
  $('renameModal').hidden = false;
  $('renameName').focus();
  $('renameName').select();
}
function closeRename() { $('renameModal').hidden = true; }
async function submitRename() {
  const to = $('renameName').value.trim();
  const from = renameTarget;
  closeRename();
  if (!from || !to || to === from.name) return;
  try {
    await invoke('hub_sftp_rename', { server, from: joinPath(cwd, from.name), to: joinPath(cwd, to) });
    if (selected && selected.name === from.name) { selected = null; $('downloadBtn').disabled = true; }
    toast('已重命名为 ' + to);
    await refresh();
  } catch (e) {
    toast('重命名失败：' + e);
  }
}
$('renameClose').addEventListener('click', closeRename);
$('renameCancel').addEventListener('click', closeRename);
$('renameOk').addEventListener('click', submitRename);
$('renameForm').addEventListener('submit', (e) => { e.preventDefault(); submitRename(); });
$('renameModal').addEventListener('click', (e) => { if (e.target.id === 'renameModal') closeRename(); });

/* ---------- 删除 ---------- */
let delTarget = null;
function openDelete(entry) {
  delTarget = entry;
  $('delText').textContent = entry.dir
    ? '删除目录 ' + entry.name + '？（目录须为空，此操作不可恢复）'
    : '删除文件 ' + entry.name + '？此操作不可恢复。';
  $('delModal').hidden = false;
}
function closeDel() { $('delModal').hidden = true; }
async function submitDelete() {
  const e = delTarget;
  closeDel();
  if (!e) return;
  try {
    await invoke('hub_sftp_remove', { server, path: joinPath(cwd, e.name), isDir: e.dir });
    if (selected && selected.name === e.name) { selected = null; $('downloadBtn').disabled = true; }
    toast('已删除 ' + e.name);
    await refresh();
  } catch (err) {
    toast('删除失败：' + err);
  }
}

/* ---------- 路径快跳（▾） ---------- */
function openPathMenu(btn) {
  const m = $('pathMenu');
  m.textContent = '';
  const parts = cwd.split('/').filter((p) => p !== '');
  const add = (label, path, isCurrent) => {
    const b = document.createElement('button');
    b.className = 'mono' + (isCurrent ? ' cur' : '');
    b.textContent = label;
    b.setAttribute('aria-current', String(isCurrent));
    if (!isCurrent) b.addEventListener('click', () => { closePathMenu(); gotoDir(path); });
    m.appendChild(b);
  };
  add('/ （根目录）', '/', parts.length === 0);
  let acc = '';
  parts.forEach((part, i) => {
    acc += '/' + part;
    add(acc, acc, i === parts.length - 1);
  });
  m.hidden = false;
  const r = btn.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8)) + 'px';
  let y = r.bottom + 4;
  if (y + mh > window.innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  m.style.top = y + 'px';
}
function closePathMenu() { $('pathMenu').hidden = true; }

/* ---------- 工具钮 / 键盘 ---------- */
$('upBtn').addEventListener('click', () => { if (cwd !== '/') gotoDir(cwd.replace(/\/[^/]*\/?$/, '') || '/'); });
$('refreshBtn').addEventListener('click', refresh);
$('downloadBtn').addEventListener('click', () => { if (selected) downloadEntry(selected); });
$('uploadBtn').addEventListener('click', upload);
$('pathDropBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const m = $('pathMenu');
  if (m.hidden) openPathMenu($('pathDropBtn')); else closePathMenu();
});
$('delClose').addEventListener('click', closeDel);
$('delCancel').addEventListener('click', closeDel);
$('delOk').addEventListener('click', submitDelete);
$('delModal').addEventListener('click', (e) => { if (e.target.id === 'delModal') closeDel(); });
document.addEventListener('click', (e) => {
  if (!$('rowMenu').hidden && !$('rowMenu').contains(e.target)) closeRowMenu();
  if (!$('pathMenu').hidden && !$('pathMenu').contains(e.target)) closePathMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeRowMenu(); closePathMenu();
  if (!$('delModal').hidden) closeDel();
  if (!$('renameModal').hidden) closeRename();
  if (!$('infoModal').hidden) closeInfo();
  if (!$('destModal').hidden) closeDest();
  closeMkdir();
});

/* ---------- 时钟 ---------- */
function tickClock() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  $('footClock').textContent =
    `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
setInterval(tickClock, 1000); tickClock();

/* ---------- 后端事件 ---------- */
if (listen) {
  listen('hub-sftp-progress', (event) => {
    const { name, dir, bytes, total, done, failed } = event.payload;
    if (failed) {
      $('transferPct').textContent = '失败';
      $('transferPct').classList.add('fail');
      $('transferBar').classList.remove('indet');
      $('transferFill').style.width = '0%';
      $('transferMeta').textContent = '';
      return;
    }
    showTransfer(dir, (dir === 'up' ? '上传 ' : '下载 ') + name, dir === 'up' && !done);
    if (done) {
      $('transferBar').classList.remove('indet');
      $('transferFill').style.width = '100%';
      $('transferPct').textContent = '100%';
      $('transferMeta').textContent = '';
    } else if (total > 0) {
      $('transferBar').classList.remove('indet');
      updateTransfer(bytes, total);
    }
  });
  // hub 再点一次「浏览文件」：换服务器并回到家目录
  listen('hub-files-open-server', async (event) => {
    server = event.payload;
    renderHeader();
    await bootDir();
  });
}

/* ---------- 头部与启动 ---------- */
function renderHeader() {
  $('title').textContent = '文件 — ' + (server ? server.name : '');
  const pill = $('connPill');
  pill.hidden = false;
  if (server && server.protocol === 'ssh') {
    pill.className = 'pill ok';
    $('connText').textContent = '已连接 ' + (server.user || '?') + '@' + (server.host || '?');
  } else {
    pill.className = 'pill bad';
    $('connText').textContent = 'Telnet 不支持文件浏览';
  }
}

async function bootDir() {
  if (!invoke || !server) return;
  try {
    cwd = await invoke('hub_sftp_home', { server });
  } catch (e) {
    cwd = '/';
    toast(String(e));
  }
  await gotoDir(cwd, true);
}

(async function boot() {
  if (!invoke) { $('emptyTip').hidden = false; $('emptyTip').textContent = '非 Tauri 环境（预览）'; return; }
  try { server = await invoke('hub_sftp_take_pending'); } catch (e) { console.error(e); }
  if (!server) { $('emptyTip').hidden = false; $('emptyTip').textContent = '没有指定服务器'; return; }
  renderHeader();
  await bootDir();
})();
</script>
</body>
