<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>发现新版本</title>
    <link href="./update.css" rel="stylesheet" />
  </head>
  <body>
    <main class="panel">
      <header><strong id="title">发现新版本</strong><small id="current"></small></header>
      <p id="meta"></p>
      <pre id="notes"></pre>
      <div id="progress-wrap">
        <div class="bar"><span id="bar-fill"></span></div>
        <p id="progress-meta"><span id="pct">0%</span><span id="bytes"></span><span id="source"></span></p>
      </div>
      <p id="error"></p>
      <div class="actions">
        <button id="download" type="button">下载</button>
        <button id="install" type="button" class="primary" hidden>安装并重启</button>
        <button id="skip" type="button" class="secondary">跳过此版本</button>
        <button id="later" type="button" class="secondary">稍后</button>
      </div>
      <p id="hint">下载源与检查频率可在「远程管理 → 关于」里设置 · 关闭窗口 = 稍后再说</p>
    </main>
    <script src="./update.js"></script>
  </body>
</html>
