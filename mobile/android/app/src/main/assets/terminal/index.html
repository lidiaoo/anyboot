<!DOCTYPE html>
<!-- AnyBoot 手机端终端宿主页：xterm.js 渲染，字节流经 AndroidBridge 与原生会话互通。
     本文件不碰网络 —— 所有数据都来自 Activity 注入的 TerminalSession。 -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  /* 兜底：vw/vh 直接取自视口，不经过 html/body 的百分比高度（本机 WebView 里百分比高度会算成 0）。
     JS 的 syncSize() 随后会用精确像素覆盖（含四周留白）。 */
  #term { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; }
  .xterm .xterm-viewport { background-color: transparent !important; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  var term = null;
  var fitAddon = null;
  var bridge = null;
  var fontSize = 14;
  var pending = [];   // 页面没就绪时的下行缓冲，termInit 后冲给终端

  // 诊断：把页面侧的关键状态回报到原生 logcat（tag ABTERM）
  function jlog(msg) {
    try {
      if (window.AndroidTerminal && window.AndroidTerminal.log) {
        window.AndroidTerminal.log(msg);
      } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosTerminal) {
        window.webkit.messageHandlers.iosTerminal.postMessage({ log: msg });
      }
      console.log('ABTERM ' + msg);
    } catch (e) { /* 回报本身不许炸 */ }
  }

  window.onerror = function (msg, src, line, col, err) {
    jlog('JS ERROR ' + msg + ' @' + line + ':' + col + ' stack=' + (err && err.stack ? err.stack : ''));
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    jlog('JS REJECT ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  jlog('页面脚本已加载 readyState=' + document.readyState);

  // 高频事件（每次按键、每帧数据）的日志默认关；排查时改成 true（logcat -s ABTERM）
  var VERBOSE = false;
  function jlogV(msg) { if (VERBOSE) jlog(msg); }

  var THEMES = {
    dark: {
      background: '#1E1E1E', foreground: '#D4D4D4',
      cursor: '#D4D4D4', cursorAccent: '#1E1E1E',
      selectionBackground: '#5A5A5A'
    },
    light: {
      background: '#FFFFFF', foreground: '#333A45',
      cursor: '#333A45', cursorAccent: '#FFFFFF',
      selectionBackground: '#B3D4FC'
    }
  };

  function b64FromBytes(bytes) {
    var binary = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function b64ToBytes(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  // Activity 注入的下行（积攒回显 + 实时数据共用一个口子）
  window.termFeed = function (b64) {
    if (!term) { pending.push(b64); jlog('termFeed 无 term，入 pending(' + pending.length + ')'); return; }
    jlogV('termFeed 写入 ' + b64.length + ' 字符');
    term.write(b64ToBytes(b64));
  };

  window.termSetFont = function (size) {
    fontSize = size;
    if (term) {
      term.options.fontSize = size;
      fit();
    }
  };

  window.termSetTheme = function (name) {
    if (term) term.options.theme = THEMES[name] || THEMES.dark;
  };

  // 上行通道：Android = addJavascriptInterface 对象；iOS = WKScriptMessageHandler
  function sendUpstream(bytes) {
    var b64 = b64FromBytes(bytes);
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosTerminal) {
      window.webkit.messageHandlers.iosTerminal.postMessage({ data: b64 });
    } else if (window.AndroidTerminal) {
      window.AndroidTerminal.onData(b64);
    }
  }

  var lastCols = -1, lastRows = -1;

  // force=true 时无条件上报（会话绑定后必须重报一次：新会话的 PTY 是 openShell 定的 80x24，
  // 与 xterm 的真实尺寸对不上；同尺寸重报不会触发远端 SIGWINCH，OpenSSH 会自己比对）
  function reportResize(force) {
    if (!window.__ready || !term) return;
    if (!force && term.cols === lastCols && term.rows === lastRows) return;
    lastCols = term.cols;
    lastRows = term.rows;
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosTerminal) {
      window.webkit.messageHandlers.iosTerminal.postMessage({ cols: String(term.cols), rows: String(term.rows) });
    } else if (window.AndroidTerminal) {
      window.AndroidTerminal.onResize(String(term.cols), String(term.rows));
    }
  }

  function fit() {
    if (!fitAddon) { jlog('fit 跳过：无 fitAddon'); return; }
    try {
      fitAddon.fit();
      jlog('fit ok ' + term.cols + 'x' + term.rows + ' | ' + geom());
      reportResize();
    } catch (e) { jlog('fit 异常: ' + e.message); }
  }

  var INSET_X = 4, INSET_TOP = 6, INSET_BOTTOM = 4;

  // 唯一尺寸来源：视口像素 → #term 像素 → fit。绕开百分比高度/inset 解析的坑。
  function syncSize() {
    var el = document.getElementById('term');
    if (!el || !window.innerWidth || !window.innerHeight) return;
    el.style.width = Math.max(80, window.innerWidth - INSET_X * 2) + 'px';
    el.style.height = Math.max(40, window.innerHeight - INSET_TOP - INSET_BOTTOM) + 'px';
    fit();
  }

  // 原生侧在会话绑定时调（切回终端页 / 同一会话重挂）：
  // 把当前真实行列数重新报给 PTY —— 否则 PTY 会一直停在 openShell 时的 80x24
  window.termSync = function () { syncSize(); reportResize(true); };

  window.addEventListener('resize', syncSize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncSize);
  }
  if (window.ResizeObserver) {
    try { new ResizeObserver(syncSize).observe(document.documentElement); } catch (e) { /* 不支持就算了 */ }
  }

  // 诊断：把几何尺寸一次性吐出来（排查 1 行高的问题）
  window.termGeom = function () {
    var el = document.getElementById('term');
    var x = document.querySelector('.xterm');
    return JSON.stringify({
      vw: window.innerWidth, vh: window.innerHeight, dpr: window.devicePixelRatio,
      bodyH: document.body.clientHeight, bodyW: document.body.clientWidth,
      termH: el ? el.clientHeight : -1, termW: el ? el.clientWidth : -1,
      xtermH: x ? x.clientHeight : -1,
      cols: term ? term.cols : -1, rows: term ? term.rows : -1
    });
  };
  function geom() { try { return window.termGeom(); } catch (e) { return 'geom错误:' + e.message; } }

  window.termInit = function (themeName, size) {
    jlog('termInit 进入 term=' + (term ? 'yes' : 'no') + ' Terminal=' + (typeof Terminal));
    if (term) return;
    fontSize = size || 14;
    term = new Terminal({
      theme: THEMES[themeName] || THEMES.dark,
      fontSize: fontSize,
      fontFamily: 'Menlo, monospace',
      cursorBlink: true,
      allowProposedApi: true,
      scrollback: 5000
    });
    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('term'));
    syncSize();
    // 上行：键盘输入（字节流原样转发，不做任何解析；term 已建即放行，未连上时原生侧安全丢弃）
    term.onData(function (data) {
      jlogV('键盘→上行 ' + JSON.stringify(data));
      sendUpstream(new TextEncoder().encode(data));
    });
    // 布局晚到的兜底：WebView 首帧常常还没量到真实高度
    requestAnimationFrame(syncSize);
    setTimeout(syncSize, 100);
    setTimeout(syncSize, 400);
    // 就绪：把页面打开前积攒的下行冲进去，再放开上行
    jlog('termInit 冲 pending=' + pending.length);
    while (pending.length > 0) {
      term.write(b64ToBytes(pending.shift()));
    }
    window.__ready = true;
    jlog('termInit 完成 ' + term.cols + 'x' + term.rows);
  };
</script>
</body>
</html>
