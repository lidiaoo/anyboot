# 本机进程地址空间限制 4G（ulimit -v）：heap+metaspace+codecache 必须留出余量
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -Xss512k -Dfile.encoding=UTF-8 -Duser.home=/home/jianghh
org.gradle.parallel=true
org.gradle.caching=true

# Jetpack Compose 全家桶都基于 AndroidX，必须打开；Jetifier 不需要（无旧 support 库依赖）
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
