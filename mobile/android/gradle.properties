# 本机进程地址空间限制 4G（ulimit -v）：heap+metaspace+codecache 必须留出余量。
# metaspace 192m 时 lintVitalAnalyzeRelease 会 OOM（Metaspace）——终端设置那轮代码量上来后实测撞过，
# 提到 512m/2048m（总虚拟内存 ≈2.7G，4G 限额内仍有余量）。
# 注意 -Duser.home 指向 Linux 机器路径；其它平台构建如出问题按平台覆盖。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=48m -Xss512k -Dfile.encoding=UTF-8 -Duser.home=/home/jianghh
org.gradle.parallel=true
org.gradle.caching=true

# Jetpack Compose 全家桶都基于 AndroidX，必须打开；Jetifier 不需要（无旧 support 库依赖）
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
