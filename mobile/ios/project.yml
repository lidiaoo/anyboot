# AnyBootRemote · XcodeGen 工程定义
#
# 生成：在本目录跑 `xcodegen`，得到 AnyBootRemote.xcodeproj。
# 生成后的工程用 Xcode 打开即可构建；改了源码/本文件后重跑一次 xcodegen 刷新。
#
# 依赖：Citadel（SSH/Telnet 栈）。源码按 2026-10 的 main 分支 API 校对
# （见 README 与 SshSessionManager.swift 注释），所以这里钉的是 main 分支；
# 若日后要钉版本，改成 `majorVersion: x.y` 即可。
name: AnyBootRemote
options:
  bundleIdPrefix: com.anyboot
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"   # Citadel main 要求 iOS 17+（README 的 15+ 已过时）

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    branch: main
  # ---- UI 层开源框架（已核实：许可 / 部署目标 / product 名）----
  # Flow：HFlow/VFlow 真 flex-wrap，弹性和 justified 模型，Layout 协议（iOS 16+，MIT）
  Flow:
    url: https://github.com/tevelee/SwiftUI-Flow
    from: "3.5.1"
  # PopupView：弹层/浮层统一（iOS 17+，MIT）
  PopupView:
    url: https://github.com/exyte/PopupView
    from: "5.0.8"
  # AlertToast：HUD / toast（iOS 13+，MIT）
  AlertToast:
    url: https://github.com/elai950/AlertToast
    from: "1.3.9"
  # SwiftUIIntrospect：拿底层 UIKit 视图去掉系统默认样式（iOS 13+，MIT）
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    from: "27.1.0"
  # 源码直接 import 了 Citadel 的传递依赖，必须显式声明成 target 依赖才可见；
  # 版本下限对齐 Citadel main 实际解析结果（Wellz26 fork 的 nio-ssh 0.3.7）
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: "0.3.7"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.104.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.15.1"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: false
    PRODUCT_NAME: "$(TARGET_NAME)"
    # ---- 真机安装用的签名档位 ----
    # Team ID 在 Xcode ▸ Settings ⌘, ▸ Accounts ▸ 左侧选中 Apple ID，
    # 右侧 Teams 表里团队名下面那串 10 位大写字母数字。
    # 免费 Apple ID 也有（个人团队），只是证书 7 天过期；付费账号 1 年。
    # 注意：别再带 CODE_SIGNING_ALLOWED=NO —— 未签名包没有 entitlement，
    # 钥匙串全部返回 -34018，表现为「密码存不住、每次都要手输」。
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "T5657S257B"   # huihua jiang (Personal Team)
  configs:
    # xcodegen 不会自动注入 DEBUG，不写这条 `#if DEBUG` 就是死代码
    # （DemoSeed / 传输调试种子都靠它，缺了整个调试种子链路静默失效）
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) DEBUG=1"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  AnyBootRemote:
    type: application
    platform: iOS
    productName: AnyBootRemote
    sources:
      # 全部 Swift 源码；terminal 资源单独抽出来做 folder reference
      - path: AnyBootRemote
        excludes:
          - "Resources/terminal"
          - "Resources/terminal/**"
      # folder reference（type: folder）：整个目录原样进 bundle，
      # TerminalView.swift 按 Bundle resourceURL 下的 terminal/ 子目录加载
      - path: AnyBootRemote/Resources/terminal
        type: folder
        buildPhase: resources
    # Info.plist 由 xcodegen 生成（属性在下面 properties）。
    # ⚠️ 四项不能少，少了运行就坏：
    # - ATS 明文放行：服务端是局域网 http://192.168.x.x:12300，不放行直接拒连
    # - 本地网络用途描述：iOS 14+ 访问局域网设备必须声明，否则静默失败
    # - CFBundleDisplayName / UILaunchScreen / 方向：UI 基本盘
    info:
      path: Info.plist
      properties:
        # 版本号与 GitHub release tag 同轴（发版时与 info.plist / Cargo.toml / tauri.conf.json
        # 一起改）：tag v0.2.0 → CFBundleShortVersionString 0.2.0，CFBundleVersion 200
        # （= major*10000+minor*100+patch）。检查更新只比 ShortVersion（ABUpdateCheck.isNewer），
        # 不同轴会永远判成「已是最新」。
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "200"
        CFBundleDisplayName: AnyBoot 远程
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 需要访问局域网内的电脑端 AnyBoot 服务，用于读取和修改启动项设置。
        NSCameraUsageDescription: 扫描电脑端的配对二维码需要相机权限（配对串只在生成时显示一次）。
        CFBundleURLTypes:
          - CFBundleURLName: com.anyboot.remote
            CFBundleURLSchemes:
              - anyboot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # Bundle ID：免费 Apple ID 签名前必须改成全局唯一的（例如
    # com.<你的名字>.anybootremote）。被占用时 Xcode 报
    # "The app identifier … has already been taken"。改完重跑 xcodegen。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyboot.AnyBootRemote
    dependencies:
      - package: Citadel
        product: Citadel
      - package: NIOSSH
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-crypto
        product: Crypto
      - package: Flow
        product: Flow
      - package: PopupView
        product: PopupView
      - package: AlertToast
        product: AlertToast
      - package: SwiftUIIntrospect
        product: SwiftUIIntrospect

